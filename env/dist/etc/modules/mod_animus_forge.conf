#   ... and how long a bearing chosen with the move block keeps being walked before it lapses (ms). Shorter than the
#   others on purpose: those are standing instructions about a target, which stay true while the fight does, where a
#   direction chosen against the ground goes stale as soon as the seat has covered it. Re-pressing keeps it going,
#   which is what a held key is.
AnimusForge.Curriculum.Options.MoveBearingMs = 3000

#   ... and how long a turn or a pitch keeps being held (ms). Shorter again than a bearing: a seat that keeps turning
#   for three seconds has spun round twice, so this is the length of a glance rather than of a journey. What it has
