# M1 -- controls (movement-curriculum plan §2): the root of the movement curriculum, and the file every later movement
# stage's config extends. What a new player learns in the first minute: forward, turning, strafing, and stopping where
# it meant to. A marker 5-60 yd off on open ground, anywhere round by the last rung, stopped on inside a radius that
# tightens from 4 to 0.5 yd (Stages.cpp, MarkerEncounter; the ladder is the sim's, Markers.* in the conf template),
# then the next, 3-8 an episode. One policy for every class of AnimusForge.Classes: each class is a layout (its own
# adapter and head around a shared trunk) and exports as its own model (warrior_controls.amdl, ...).
#
# The hyperparameters are the archived curriculum's base (configs/archive/stage4_duel.yaml, git tag curriculum-v1),
# with the movement stage's own changes marked. Every movement stage uses the same network widths, or seeding cannot
# copy the trunk.

run_name: move1_controls
socket: /tmp/animus-forge.sock
seed: 1

# The first stage: nothing to seed from. The later movement stages seed from the closest trained one (stage.json).
init_from: auto

# A ceiling, not a target (plan §4: 150M, expected 1-2 h): convergence ends the stage.
total_env_steps: 150000000
rollout_length: 128

overlap_updates: true
torch_threads: 4
log_every: 1
checkpoint_every: 100
keep_checkpoints: 5

train_device: auto
rollout_device: auto

mappo:
  hidden: [256, 512, 512]
  # Per 100 ms of game time, compounded to AnimusForge.DecisionMs (250 ms; the decision cadence is plan 8.5's open
  # research item, the world tick is 50 ms whatever it becomes).
  gamma: 0.997
  gae_lambda: 0.985
  reference_decision_ms: 100
  foresight_coef: 0.25
  foresight_horizons_seconds: [5.0, 30.0]
  foresight_time_scale_seconds: 60.0
  recurrent_size: 128
  # No entity in a movement layout is a set (nothing to fight, no one beside it).
  seat_sets: false
  chunk_length: 32
  goal_count: 12
  goal_slots: 4
  hindsight_coef: 0.1
  goal_targets: 29
  goal_every_decisions: 64
  slow_goal_size: 128
  slow_goal_gamma: 0.993
  slow_goal_lambda: 0.95
  slow_goal_lr: 0.0003
  foresight_obs_targets: true
  foresight_feedback: true
  goal_lookahead: true
  lookahead_coef: 0.5
  slow_layout: director
  slow_gamma: 0.996
  slow_gae_lambda: 0.98
  goal_entropy_scale: 1.0
  goal_entropy_final_fraction: 0.05
  goal_slot_entropy_weight: 0.1
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  lr_final_fraction: 0.1
  # A floor on exploration: 25 held controls, and the last half-yard of a stop is found by trying.
  entropy_final_fraction: 0.3
  epochs: 4
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
  value_norm_beta: 0.99
  per_layout_advantages: true
  min_layout_rows: 32
  target_kl: 0.02

# Seeded evaluation: spread over every rung of the marker ladder (the sim's DifficultyLadder), so eval.jsonl's
# per-tier rows hold `arrived` at the top rung, which is the stage's real task (user, 2026-10-05). Every third
# evaluation also plays sampled actions on the same seeds: the movement stages' jitter is what a sampled policy shows
# and an argmax one can hide.
eval:
  every_env_steps: 5000000
  at_start: true
  episodes: 2048
  seed: 1000
  deterministic: true
  sampled_every: 3
  trace_episodes: 64
  report: [arrived, markers, markers_wanted, markers_broken, difficulty, at_top_rung, marker_radius, time_ratio,
           overshoot, stop_distance, stops_near, distance_travelled, died, timed_out, reward_arrive, reward_progress,
           reward_facing, reward_jitter, reward_effort, reward_repeat]

convergence:
  patience: 3
  window: 4
  z: 2.0
  min_improvement: 0.02
  min_improvement_abs: 0.01
  kl: 0.003
  entropy_slope: 0.01
  hold_share: 0.02
  lr_hold_until_plateau: true

# The shaping (Progress on the straight-line distance, Facing on the marker's bearing) is a start, not the lesson:
# it fades rung by rung once markers are being stopped on 80% of the time, never on a plateau before (plan §1.2, the
# stage3 lesson of 2026-10-05: shaping pulled before the stage's own measure is learned stops the learning).
fade:
  enabled: true
  rungs: [1.0, 0.5, 0.25, 0.0]
  window: 3
  regress_z: 2.0
  give_up: 2
  gate_metric: arrived
  gate_value: 0.8

# The noise prices (Repeat, Jitter, Aimless, Effort, Fidget): free until the evaluation stops on 80% of its markers,
# then in to full price, each step on a plateau, and the ladder ends at full price -- habits do not stick without it
# (plan §1.3; stage1, 2026-10-04: full prices from step 0 stood the bot still).
costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05

# More episodes for the classes stopping on the fewest markers, and a fifth of training resets replay an evaluation
# episode that missed one.
layout_sampling:
  enabled: true
  strength: 1.0
  max_ratio: 4.0
  metric: arrived
  replay_fraction: 0.2

# The movement-style reward (animus.style): off until human data exists (plan §3), then on from M1, on the cost
# ladder's scale.
style:
  enabled: false
