# M1 -- controls, seen through the camera (the user's design, 2026-10-05; redesigned 2026-10-06, perception-goals
# REDESIGN section 1): straight lines and stopping on a point, taught on what the camera sees so M2 starts with a camera
# that works. An empty instance of the Stockades; each episode the seat spawns at a random hallway point (the entrance
# among them), facing a random way, and one real object of M2's pool (chest, crate, barrel, sack, strongbox) stands at
# another, 10 to 120 yd off, in sight of the seat's eye -- later rungs put a quarter of them just round a corner. Reach
# it as fast as possible and stop beside it (within its bounding radius and a yard of its centre): the time cost
# (Markers.StepCost, each decision until the stop) is the price of everything else, Arrive is paid once, on the stop
# (Stages.cpp move1_controls, SightEncounter).
#
# The compass fades out by rung: each episode it is withheld (its presence and values 0, an absent input, never a mask)
# with the chance the shaping fade's rung asks -- 0, 0.25, 0.6, 0.9 at x1, x0.5, x0.25, x0 (Controls.Withhold0..3). By
# the top rung the seat goes to what it sees. Wall and Stuck are charged from the first step at a small fixed price
# (Controls.Wall/Stuck, 0.02 a second each), off the cost ladder.
#
# Every class and race, at level 1 (death knights at 55): one policy, one layout per class (its own adapter and head
# around a shared trunk), so every class learns the movement from the start, with a kit too small to matter.
#
# Seeded from the current M1 (its latest.pt, through finetune_from below): the move and compass blocks carry by name
# (the compass split's remap), the camera trains on M1's dense reward. The first movement curriculum (move1_controls
# ... move7_follow) is archived: configs/archive/movement-v1/, the definitions on the git tag curriculum-movement-v1.

run_name: move1_controls
socket: /tmp/animus-forge.sock
seed: 1

# The first stage: nothing to extend. The redesign starts from the current M1's checkpoint (amendment 5) through
# finetune_from (its default, runs/_finetune/move1_controls/best.pt): copy the old run's latest.pt there before
# `forge start move1_controls` archives it. The move and compass blocks carry by name (bootstrap's remap; the old run is
# move revision 4, the compass inside it); a block the redesign changed starts fresh.
init_from: auto

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 150000000
rollout_length: 128

overlap_updates: true
torch_threads: 4
log_every: 1
checkpoint_every: 100
keep_checkpoints: 5

train_device: auto
rollout_device: auto

mappo:
  hidden: [256, 512, 512]
  # Per 100 ms of game time, compounded to AnimusForge.DecisionMs (250 ms; the decision cadence is plan 8.5's open
  # research item, the world tick is 50 ms whatever it becomes).
  gamma: 0.997
  gae_lambda: 0.985
  reference_decision_ms: 100
  foresight_coef: 0.25
  foresight_horizons_seconds: [5.0, 30.0]
  foresight_time_scale_seconds: 60.0
  recurrent_size: 128
  # No entity in a movement layout is a set (nothing to fight, no one beside it).
  seat_sets: false
  chunk_length: 32
  goal_count: 12
  goal_slots: 4
  hindsight_coef: 0.1
  goal_targets: 29
  goal_every_decisions: 64
  slow_goal_size: 128
  slow_goal_gamma: 0.993
  slow_goal_lambda: 0.95
  slow_goal_lr: 0.0003
  foresight_obs_targets: true
  foresight_feedback: true
  goal_lookahead: true
  lookahead_coef: 0.5
  slow_layout: director
  slow_gamma: 0.996
  slow_gae_lambda: 0.98
  goal_entropy_scale: 1.0
  goal_entropy_final_fraction: 0.05
  goal_slot_entropy_weight: 0.1
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  # The look head's three entropies sum to up to 5.17 nats against movement's one (~3.2), so at the same coefficient
  # the camera was pushed to uniform: it turned 78% of decisions and M1 trailed the fixed camera (-2.44 vs +0.20 at
  # 10M). A tenth of movement's (overseer, 2026-10-06); it follows the same schedule and floor.
  look_entropy_coef: 0.001
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  lr_final_fraction: 0.1
  # A floor on exploration: 25 held controls, and the last half-yard of a stop is found by trying.
  entropy_final_fraction: 0.3
  epochs: 4
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
  value_norm_beta: 0.99
  per_layout_advantages: true
  min_layout_rows: 32
  target_kl: 0.02
  # The camera's update a minibatch at once (camera-vision.FREELOOK.md, R3): at 128 x 64 a minibatch of 6144 rows
  # peaks at ~5.6 GiB for the encoder alone, which the card holds when M1 has it to itself (9.3 GB in use chunked).
  # 1024 chunks it to 0.94 GiB for ~1.7x the encoder's time (the forward is run twice), for a shared card.
  vision_chunk_rows: 0

# Seeded evaluation: a fixed set of 32 (spawn, object) pairs over the hallways, 8 of them round a corner
# (Stages.cpp StockadeSightPairs), each played with the compass and without (SightDraw::EvaluationPick: the seeds go
# round the castings, every casting meets each of its pairs both ways). 512 episodes spread over every class and race.
# Every third evaluation also plays sampled actions on the same seeds: the jitter a sampled policy shows, an argmax one
# can hide.
eval:
  every_env_steps: 5000000
  at_start: true
  episodes: 512
  seed: 1000
  deterministic: true
  sampled_every: 3
  trace_episodes: 64
  report: [arrived, arrived_no_compass, arrived_with_compass, compass_withheld, compass_withhold_chance, compass_rung,
           arrive_seconds, time_ratio, arrive_seconds_sight, time_ratio_sight, arrive_seconds_corner,
           time_ratio_corner, markers_sight, markers_corner, stop_distance, overshoot, stops_near, distance_travelled,
           objective_distance,
           objective_corner, objective_visible, course_kinks, control_changes_per_minute, wall_seconds, stuck_seconds,
           movement_casts, died, timed_out, reward_arrive, reward_step_cost, reward_progress, reward_facing,
           reward_wall, reward_stuck, reward_jitter, reward_effort, reward_repeat]

# forge status for this stage (the user, 2026-10-05; REDESIGN 2026-10-06): did it stop beside the object, with the
# compass and without, how fast, how precisely, and how cleanly it got there. compass_withheld is the share of the
# episodes that withheld it (training: the rung's chance). Watch arrived_no_compass against it (amendment 5): near 0 at
# the 0.6 rung means the camera is not being learned. stop_distance is the air between the body and the object's widest
# side. The time and its ratio are read in sight of the spawn (_sight): round a corner (_corner) the optimum is still
# the straight line through the wall, so its ratio reads high by the corner, not by slowness; the evaluation's tables
# also split every measure by placement (category objective_corner). Targets are a readout, never a gate.
status:
  headline: [arrived, arrived_no_compass, arrived_with_compass, compass_withheld, arrive_seconds_sight,
             time_ratio_sight, time_ratio_corner, stop_distance, overshoot, stops_near, course_kinks,
             control_changes_per_minute, wall_seconds, timed_out, died]
  targets:
    arrived: ">= 0.95"
    arrive_seconds_sight: "<= 18"
    time_ratio_sight: "<= 1.1"
    stop_distance: "<= 0.5"
    overshoot: "<= 0.5"
    stops_near: "<= 1.2"
    course_kinks: "<= 5"
    wall_seconds: "<= 0.5"
    timed_out: "<= 0.02"
    died: "<= 0.01"

convergence:
  # Converged on the stage's own measure, the share of runs stopped beside the object (the evaluation's, half of it
  # without the compass). The score alone is not the readout; the shaping fade settled is a convergence signal too.
  measure: arrived
  patience: 3
  window: 4
  z: 2.0
  min_improvement: 0.02
  min_improvement_abs: 0.01
  kl: 0.003
  entropy_slope: 0.01
  hold_share: 0.02
  lr_hold_until_plateau: true

# The fade is two ladders in one: the shaping (Progress on the straight distance, Facing on the object's bearing) fades,
# and the compass is withheld more often each rung (SightEncounter reads the rung off the shaping scale). It steps on
# the existing rules -- the window, the plateau, the regression back -- gated on arrived_at_rung: the evaluation's
# arrival at the rung's own withholding mix (animus.evaluation), never the 50/50 evaluation's plain arrival, which a
# policy at the first rung (never shown an absent compass) could not bring to the gate (amendment 7). A curriculum
# ladder, not a pass gate: the stage still ends on convergence.
fade:
  enabled: true
  # Starts at x0.5 (the compass withheld a quarter of the time): x1 (always shown) was mastered (99.6% arrive, 0.17 yd
  # stops) and the fade waited on a score plateau to leave it (the user, 2026-10-06: start the fade now).
  # Then x0.25 (withheld 60%, corners on), at the user's word (2026-10-06) with no-compass arrivals at 75% (eval) / 91%
  # (train) on x0.5 and the score still rising.
  rungs: [0.25, 0.0]
  window: 3
  regress_z: 2.0
  give_up: 2
  gate_metric: arrived_at_rung
  gate_value: 0.8

# The noise prices (Repeat, Jitter, Aimless, Effort, Fidget): free until 80% of runs stop beside the object at the
# rung's mix, then in to full price. Wall and Stuck are not on this ladder (a fixed price from the first step), and
# neither is the time cost.
# Off (the noise prices at full price from the first step), so the shaping fade, and the compass withholding with it,
# starts at once: the ladder waited ~45M steps before the fade could move, with the camera learning nothing
# (the user, 2026-10-06). M1's movement comes seeded from the old M1, so full prices from the start are cheap.
costs:
  enabled: false
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived_at_rung
  gate_value: 0.8

entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05

# More episodes for the classes stopping beside the object least often, and a fifth of training resets replay an
# evaluation episode that missed it (its pair; its compass is the rung's draw).
layout_sampling:
  enabled: true
  strength: 1.0
  max_ratio: 4.0
  metric: arrived
  replay_fraction: 0.2

# The movement-style reward (animus.style): off until human data exists.
style:
  enabled: false
