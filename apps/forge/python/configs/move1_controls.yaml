# M1 -- controls (the user's design, 2026-10-05): stopping exactly on a marker. An empty instance of the Stockades;
# the seat spawns at the entrance (backing into the portal leaves nothing: only a client's area-trigger packet uses it,
# and the player controller never sends one), and the objective is one fixed point at the end of the entrance
# hallway, about 116 yd off. Reach it as fast as possible and stop within a yard of it: the straight line with no
# stops or detours is the fastest way, and the time cost (Markers.StepCost, paid each decision until the stop) is the
# price of everything else. Arrive is paid once, on the stop (Stages.cpp, MarkerEncounter's fixed Objective).
#
# Every class and race, at level 1 (death knights at 55): one policy, one layout per class (its own adapter and head
# around a shared trunk), so every class learns the movement from the start, with a kit too small to matter.
#
# The first movement curriculum (move1_controls ... move7_follow) is archived: configs/archive/movement-v1/, the
# definitions on the git tag curriculum-movement-v1. The hyperparameters here are its M1's, so a later movement stage
# can seed from this one (every movement stage uses the same network widths).

run_name: move1_controls
socket: /tmp/animus-forge.sock
seed: 1

# The first stage: nothing to seed from.
init_from: auto

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 150000000
rollout_length: 128

overlap_updates: true
torch_threads: 4
log_every: 1
checkpoint_every: 100
keep_checkpoints: 5

train_device: auto
rollout_device: auto

mappo:
  hidden: [256, 512, 512]
  # Per 100 ms of game time, compounded to AnimusForge.DecisionMs (250 ms; the decision cadence is plan 8.5's open
  # research item, the world tick is 50 ms whatever it becomes).
  gamma: 0.997
  gae_lambda: 0.985
  reference_decision_ms: 100
  foresight_coef: 0.25
  foresight_horizons_seconds: [5.0, 30.0]
  foresight_time_scale_seconds: 60.0
  recurrent_size: 128
  # No entity in a movement layout is a set (nothing to fight, no one beside it).
  seat_sets: false
  chunk_length: 32
  goal_count: 12
  goal_slots: 4
  hindsight_coef: 0.1
  goal_targets: 29
  goal_every_decisions: 64
  slow_goal_size: 128
  slow_goal_gamma: 0.993
  slow_goal_lambda: 0.95
  slow_goal_lr: 0.0003
  foresight_obs_targets: true
  foresight_feedback: true
  goal_lookahead: true
  lookahead_coef: 0.5
  slow_layout: director
  slow_gamma: 0.996
  slow_gae_lambda: 0.98
  goal_entropy_scale: 1.0
  goal_entropy_final_fraction: 0.05
  goal_slot_entropy_weight: 0.1
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  # The look head's three entropies sum to up to 5.17 nats against movement's one (~3.2), so at the same coefficient
  # the camera was pushed to uniform: it turned 78% of decisions and M1 trailed the fixed camera (-2.44 vs +0.20 at
  # 10M). A tenth of movement's (overseer, 2026-10-06); it follows the same schedule and floor.
  look_entropy_coef: 0.001
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  lr_final_fraction: 0.1
  # A floor on exploration: 25 held controls, and the last half-yard of a stop is found by trying.
  entropy_final_fraction: 0.3
  epochs: 4
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
  value_norm_beta: 0.99
  per_layout_advantages: true
  min_layout_rows: 32
  target_kl: 0.02
  # The camera's update a minibatch at once (camera-vision.FREELOOK.md, R3): at 128 x 64 a minibatch of 6144 rows
  # peaks at ~5.6 GiB for the encoder alone, which the card holds when M1 has it to itself (9.3 GB in use chunked).
  # 1024 chunks it to 0.94 GiB for ~1.7x the encoder's time (the forward is run twice), for a shared card.
  vision_chunk_rows: 0

# Seeded evaluation of the task itself: one place and one objective, so there is no held-out ground and no ladder;
# the evaluation spreads over every class and race. Every third evaluation also plays sampled actions on the same
# seeds: the jitter a sampled policy shows, an argmax one can hide.
eval:
  every_env_steps: 5000000
  at_start: true
  episodes: 512
  seed: 1000
  deterministic: true
  sampled_every: 3
  trace_episodes: 64
  report: [arrived, arrive_seconds, time_ratio, stop_distance, overshoot, stops_near, distance_travelled,
           course_kinks, control_changes_per_minute, wall_seconds, stuck_seconds, movement_casts, died, timed_out,
           reward_arrive, reward_step_cost, reward_progress, reward_facing, reward_jitter, reward_effort,
           reward_repeat]

# forge status for this stage (the user, 2026-10-05): did it stop on the mark, how fast, how precisely, and how
# cleanly it got there. The optimum run is about 16.6 s (116 yd at run speed, time_ratio 1); targets are a readout,
# never a gate.
status:
  headline: [arrived, arrive_seconds, time_ratio, stop_distance, overshoot, stops_near, course_kinks,
             control_changes_per_minute, wall_seconds, timed_out, died]
  targets:
    arrived: ">= 0.95"
    arrive_seconds: "<= 18"
    time_ratio: "<= 1.1"
    stop_distance: "<= 0.5"
    overshoot: "<= 0.5"
    stops_near: "<= 1.2"
    course_kinks: "<= 5"
    wall_seconds: "<= 0.5"
    timed_out: "<= 0.02"
    died: "<= 0.01"

convergence:
  # Converged on the stage's own measure, the share of runs stopped on the mark. The score alone is not the readout.
  measure: arrived
  patience: 3
  window: 4
  z: 2.0
  min_improvement: 0.02
  min_improvement_abs: 0.01
  kl: 0.003
  entropy_slope: 0.01
  hold_share: 0.02
  lr_hold_until_plateau: true

# The shaping (Progress on the straight-line distance, Facing on the objective's bearing) is a start, not the lesson:
# it fades once 80% of runs stop on the mark, never on a plateau before.
fade:
  enabled: true
  rungs: [1.0, 0.5, 0.25, 0.0]
  window: 3
  regress_z: 2.0
  give_up: 2
  gate_metric: arrived
  gate_value: 0.8

# The noise prices (Repeat, Jitter, Aimless, Effort, Fidget): free until 80% of runs stop on the mark, then in to full
# price. The time cost is not on this ladder: it is paid in full from the first step.
costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05

# More episodes for the classes stopping on the mark least often, and a fifth of training resets replay an evaluation
# episode that missed it.
layout_sampling:
  enabled: true
  strength: 1.0
  max_ratio: 4.0
  metric: arrived
  replay_fraction: 0.2

# The movement-style reward (animus.style): off until human data exists.
style:
  enabled: false
