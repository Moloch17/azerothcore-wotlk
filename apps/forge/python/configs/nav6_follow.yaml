# N6 -- moving point (vision movement curriculum PLAN §7, CONTRACT.md sec 4): the goal moves. A party in Ragefire
# Chasm and the Deadmines (Wailing Caverns held out) follows the stock-path leader (PartyFollowEncounter at player
# cadence; the frozen-checkpoint leader of the PLAN's I9 is a follow-up) with PointNav in labels-only mode: the
# leader's believed position is the point, the party frames' dot and recall are the marker, the C-map is recomputed
# when the leader's cell changes. Keep 3-10 yd (FollowKept, the Outcome), do not block, Lost on the route distance to
# the leader, the potential on the route cost-to-go to its believed position. Episodes of 300 s. Seeds from nav5_water;
# the party frames block starts fresh (its join at zero).
extends: nav5_water.yaml
run_name: nav6_follow

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 250000000

eval:
  # The wandering leader makes an episode's reading noisier: 48 held-out episodes as move4_follow's.
  heldout:
    wailing: 48
  report: [follow_kept_share, follow_distance_mean, settled_share, regroup_share, regroup_seconds, lost_seconds,
           blocking_seconds, deaths, rises, rejoins, rejoin_seconds, rejoined, dead_seconds, leader_route_share,
           leader_hops, leader_out_of_sight_seconds, leader_report_age_ms, difficulty, at_top_rung, nav_rung,
           arrived, spl, travelled_yards, falls, fall_damage_share, drowned, died, timed_out, stuck_seconds,
           wall_seconds, revisit_seconds, jumps, swim_seconds, waypoint_regret_yards, waypoints_chosen,
           course_kinks, control_changes_per_minute, reward_follow_kept, reward_blocking, reward_lost, reward_death,
           reward_step_cost, reward_stuck, reward_wall, reward_fall_hurt, reward_drowned, reward_revisit,
           reward_potential, reward_jitter, reward_effort, reward_repeat, goals_cell_chosen, goals_cell_reached,
           goals_cell_lost, goals_cell_invalid, cell_goal_seconds, reward_cell_goal, reward_cell_lost]

# forge status: the share of the episode kept within the band of the leader (the measure), stillness and regrouping,
# straying and blocking, deaths and rejoins, the modules' quality, the held-out dungeon's and the arms' kept share.
status:
  headline: [follow_kept_share, settled_share, regroup_share, regroup_seconds, lost_seconds, blocking_seconds, deaths,
             rejoin_seconds, rejoined, leader_route_share, leader_out_of_sight_seconds, falls, died, drowned,
             wall_seconds, stuck_seconds, waypoint_regret_yards, nav_rung, at_top_rung,
             costmap_iou, planner_mae_yards, planner_mae_known, reward_potential, reward_potential_train,
             follow_kept_share_heldout_wailing, follow_kept_share_no_camera, follow_kept_share_no_map,
             follow_kept_share_no_planner, follow_kept_share_no_memory]
  targets:
    # The nav targets are not this stage's measures (null drops an inherited key; a target must be in the headline).
    arrived: null
    spl: null
    drowned: null
    timed_out: null
    follow_kept_share: ">= 0.8"
    lost_seconds: "<= 5"
    blocking_seconds: "<= 3"
    rejoined: ">= 0.9"
    wall_seconds: "<= 2"
    died: "<= 0.02"
  # Death knights are never fielded here, by design: the party follows through a dungeon at its level band and a death
  # knight starts at 55; the sim draws the seat again among the classes that fit (as move4_follow).
  excluded:
    death_knight: "the party follows through a dungeon at its level band and a death knight starts at 55"

convergence:
  # Converged on the stage's own measure, the share of the episode kept within the band of the leader, at the top of
  # its ladder (argmax, on the held-out reading is the PLAN's bar; the gate reads the training evaluation).
  measure: follow_kept_share

# The ladder (a walking leader -> running -> bursts -> out of sight longer; the party 2 -> 5 seats) is the fade's, on
# the kept share: off rung 0 at 0.65, rung 1 at 0.70, rung 2 at 0.75 (move4-follow's rising gates).
fade:
  gate_metric: follow_kept_share
  gate_value: 0.75
  gate_values: [0.65, 0.70, 0.75]

layout_sampling:
  metric: follow_kept_share
