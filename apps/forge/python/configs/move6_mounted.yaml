# M6 -- riding and flight (movement-curriculum plan §2): mounting when it pays, steering at mount speed, dismounting
# where it must, flying -- take off, climb over what is in the way, cruise, land on the marker. A ride on Kalimdor
# (150-500 yd), flights in Outland (200-900 yd) and air-only markers there (MarkerMounted.* in the conf template).
# The travel block joins the layout here (the mounts' actions start fresh; the rest seeds from move5_routes).
extends: move5_routes.yaml
run_name: move6_mounted

# A ceiling (plan §4: 300M, expected 3-4 h).
total_env_steps: 300000000

eval:
  episodes: 2048
  report: [arrived, difficulty, at_top_rung, mounted_share, flying_share, takeoffs, landings, air_only_legs,
           ground_mount_on_air_leg,
           route_length, time_ratio, stop_distance, overshoot, stuck_seconds, wall_seconds, falls, fall_damage,
           course_kinks, moves_refused, movement_casts, speed_casts, spell_casts, died, timed_out, reward_arrive,
           reward_progress, reward_stuck, reward_wall, reward_fall_damage, reward_jitter, reward_effort]

costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

# Arriving is the point; how the trip was made (mounted_share, flying_share) is reported, never converged on.
convergence:
  measure: arrived
