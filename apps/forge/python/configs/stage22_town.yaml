# Stage 22: a town of the seat's side, its traders around the inn (TownEncounter). The seat arrives with junk in its
# bags, half its durability gone, one food and one drink, and two better items it has not put on: sell, repair,
# restock, dress. Won when all four are done before the two-minute clock. Nothing fights back here.
extends: stage21_gather.yaml
run_name: stage22_town
total_env_steps: 20000000
eval:
  every_env_steps: 5000000
  # 120 s episodes at 128 envs: 1024 is 960 sim-seconds an evaluation.
  episodes: 1024
  baseline: life
  report: [town_won, sold_out, repaired, stocked, upgrades_equipped, upgrades_given, copper_sold, supplies_bought,
           wasted_presses, town_band]
