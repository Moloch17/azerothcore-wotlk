# D3 -- the Deadmines (dungeon-curriculum D3; Stages.cpp dungeon3_deadmines): the door to VanCleef at levels 17-20
# (ArenaDefinition::LevelFirst/LevelLast, lifted by the ladder's rung in training), every pull and side boss --
# Rhahk'Zor,
# Sneed's Shredder and Sneed, Gilnid, Mr. Smite, Captain Greenskin, Cookie -- its doors and levers opened by a real
# interact (CMSG_GAMEOBJ_USE through the session's handler) and the Iron Clad Door by the cannon and the Defias
# Gunpowder carried from the door (CMSG_USE_ITEM): the sight block's presses; nothing opens by itself, nothing is
# looted.
# Deaths rise at the entrance and walk back; the second wipe ends a run. The difficulty ladder as in D2.
#
# **The bar** (the user's, unchanged since 2026-10-02): at levels 17-20, 70% or more of the evaluation's runs cleared
# with at most one wipe -- bar_clear (the evaluation is the ladder's last rung: the band's own levels, one wipe
# spared). Measured per boss (boss_*) and by role (deaths_tank, _healer, _damage: each seat's place in
# the party, read off its build). Wailing Caverns is held out, as in D2.
#
# Outcome and Cost as D2's. Seeded from dungeon2_ragefire: the same layout, every block carries.
extends: dungeon2_ragefire.yaml
run_name: dungeon3_deadmines

total_env_steps: 2000000000

eval:
  # A run of the Deadmines is 30-90 minutes: 64 of them every 20M.
  every_env_steps: 20000000
  episodes: 64
  report: [bar_clear, cleared, full_clear, wing_cleared_share, wing_wipes, ready_pulls,
           boss_rhahkzor, boss_sneed_shredder, boss_sneed, boss_gilnid, boss_smite, boss_greenskin, boss_cookie,
           boss_vancleef, wing_boss_kills, wing_trash_kills, wing_rises, wing_rejoins, wing_rejoin_seconds, wing_rung,
           at_top_rung, wing_level, wing_probe, with_stand_in, without_stand_in, clear_standin,
           clear_allbot, role_tank, role_healer, role_damage, deaths_tank, deaths_healer, deaths_damage, seat_deaths,
           level, died, reward_kill, reward_clear, reward_ready_pull, reward_idle, reward_lost, reward_death,
           reward_step_cost, reward_timeout, reward_threat, reward_damage_dealt, reward_repeat, reward_aimless,
           reward_effort, reward_jitter]

# forge status: the bar first, then each boss, by role, the stand-in split, and the ladder's rung.
status:
  headline: [bar_clear, cleared, full_clear, wing_wipes, boss_rhahkzor, boss_sneed, boss_gilnid, boss_smite,
             boss_greenskin, boss_cookie, boss_vancleef, deaths_tank, deaths_healer, deaths_damage,
             clear_allbot, clear_standin, standin_gap, wing_rung]
  targets:
    # Ragefire's bosses are not the Deadmines'.
    boss_oggleflint: null
    boss_taragaman: null
    boss_jergosh: null
    boss_bazzalan: null
    wing_rejoin_seconds: null
    bar_clear: ">= 0.7"
    cleared: ">= 0.7"
    full_clear: ">= 0.7"
    wing_wipes: "<= 1"
    boss_vancleef: ">= 0.7"
    standin_gap: "<= 0.1"
  excluded:
    death_knight: "the Deadmines' bar is at levels 17-20 and a death knight starts at 55"

convergence:
  measure: bar_clear

fade:
  gate_metric: bar_clear
  gate_value: 0.5

costs:
  gate_metric: bar_clear
  gate_value: 0.5

layout_sampling:
  metric: bar_clear

cast:
  partners:
    stages: [dungeon2_ragefire]
    eval_partners: [dungeon2_ragefire]
