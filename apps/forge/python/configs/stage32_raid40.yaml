# Stage 32 of the curriculum, by name: forty seats against the classic raids' bosses.
# Real instances (InstanceEncounter): the seats spawn at the raid's front door and are taken to the boss along the
# server's own path; the boss fights with the core's script; seat 0 leads the raid group. A tenth of the episodes are
# the synthetic single pack at the same seat count, the control the real bosses are graded against.
#
# Not in the default queue: 40 seats an env, so AnimusForge.Stage.stage32_raid40.Envs runs it at 8 envs
# (forge start stage32_raid40); the evaluation's 32 episodes of 480 s at 8 envs are 1,920 sim-seconds.
extends: stage31_raid25.yaml
run_name: stage32_raid40
total_env_steps: 40000000
eval:
  every_env_steps: 10000000
  episodes: 32
  baseline: fight
  report: [boss_killed, boss_health_left, wiped, evaded, engaged, died, teammates_died, boss_rung, instance_map]
# No owner in a raid: the cast is off.
cast:
  agents: {}
