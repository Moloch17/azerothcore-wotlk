# M4 -- follow (dungeon-curriculum plan Part 2; I5, the party follow, and I4, death in an instance; decision 0033). A
# party of five in an empty Ragefire Chasm or Deadmines, at the dungeon's level band: a leader (the owner's slot: the
# script's keys toward the corners of the stock path's way through the dungeon -- a script, never a bot input, the thing
# followed and not a teacher) wanders the dungeon's way: from a random point of it, hop by hop, forwards and back,
# standing a while or passing on, walking or running, looking round at its halts, until the clock ends. The four
# learned followers keep 3-10 yd from it, out of its way, through its doors and drops, standing still with it while it
# stands and regrouping after (PartyFollow.* in the conf template). A follower knows the leader by the party frames
# (always: health, power, alive, in combat, the leader), the minimap's dots (a position only within 60 yd), its memory
# of where each member was last seen and at what pace (the recall columns, party frames revision 3), what its camera
# shows and what its own recurrent memory keeps -- never a bearing through a wall. A follower that dies rises at the
# episode's start point after Respawn.DelayMs, at full health and power, and walks back; the episode never ends on a
# death. Wailing Caverns is held out.
#
# Seeds from move2_seek (stage.json's seed chain): the move block, the camera and the mental map carry over by name;
# the party frames block starts fresh (its join at zero). M2's hyperparameters otherwise; what differs is below.
extends: move2_seek.yaml
run_name: move4_follow

# The latest M2 checkpoint: the only one whose camera was trained at the locked 12-yd boom (decision 0031's run).
seed_from: latest

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 250000000

# The leader is a player in the owner's slot and the real leader of the party's group, moved along the stock path by
# the encounter (move4-follow rework): no learner row, no cast.

mappo:
  # Episodes of 300 s with the plan's longer horizon (perception-goals §3: 0.999 from M4).
  gamma: 0.999
  # M2's 2.2e-4 (deep rung, 2026-10-09) is M2's own: this stage keeps the 1.5e-4 it inherited before it.
  actor_lr: 0.00015
  critic_lr: 0.00015
  # M2's 0.01 (movement pacing M8: its frozen search camera) is M2's own: this stage keeps the 0.004 it inherited
  # before it.
  look_entropy_coef: 0.004
  # M2's greedy training envs (exploration v3, mappo.greedy_env_fraction 0.12) are its own: restated off, so none of this
  # stage's envs act with the argmax.
  greedy_env_fraction: 0.0
  # M2 holds a goal at most 32 s (128 decisions: room goals); this stage keeps M1's 16 s (64).
  goal_every_decisions: 64

# Every evaluation plays seeded episodes -- the leader's wandering is drawn from the evaluation seed, so the same parties,
# starts, hops and sudden stops each time -- at the training rung, on both training dungeons; and Wailing Caverns, held
# out, every evaluation.
eval:
  every_env_steps: 10000000
  # 96 (64 before decision 0033): the wandering leader makes an episode's reading noisier than the fixed route's.
  episodes: 96
  # M2 plays the sampled policy at every evaluation since its deep rung (2026-10-09); this stage keeps its own.
  sampled_every: 0
  # M2's held-out "sweep", "sweep_rotating" and "deadmines" (its held-out MAP; the Deadmines is a training map here) are
  # arenas this stage does not have: null drops each inherited key (the learner refuses an arena the stage lacks).
  # `wailing` (decision 0033): Wailing Caverns, never trained on, every evaluation -- a party that learned to follow is
  # told from one that learned two dungeons.
  heldout:
    sweep: null
    sweep_rotating: null
    deadmines: null
    wailing: 48
  heldout_every: 1
  heldout_on_best: false
  # M2's per-arena cadence is its own: an empty map replaces it.
  heldout_cadence: {}
  # Every scored follower's decisions, kept for the route viewer (eval_trace_<steps>_<policy>.npz).
  trace_all: true
  # The ablation arms (decision 0033), the evaluation's seeds again with one input taken away, 48 episodes each every
  # second evaluation: no_camera (the image blanked: the entity list stays), no_map (the map block and the crop),
  # no_memory (the recurrent state reset every decision), no_party (the party frames block: frames, dots and recall)
  # and no_recall (the recall columns alone: what remembering and predicting where each member is is worth). Readings,
  # never gates. M2's other arms have no meaning here (no goals of its kind, no coverage block): null drops each.
  arms_every: 2
  arms:
    no_flag: null
    no_goal: null
    random_goal: null
    random_cell: null
    no_plan: null
    no_searched: null
    no_coverage: null
    no_camera: 48
    no_map: 48
    no_memory: 48
    no_party: 48
    no_recall: 48
  report: [follow_kept_share, follow_distance_mean, settled_share, wait_seconds, wait_fidget_seconds, drift_seconds,
           regroup_share, regroup_seconds, regroups, regroup_stops, lost_seconds, blocking_seconds, deaths, rises,
           rejoins, rejoin_seconds, rejoined, dead_seconds, leader_route_share, leader_hops, leader_reverse_hops,
           leader_pass_hops, leader_stops_reached, leader_sudden_stops, leader_look_stops, leader_bursts, leader_drops,
           leader_rises, leader_reports, leader_report_age_ms, leader_moving_report_age_ms,
           leader_out_of_sight_seconds, start_along, difficulty,
           at_top_rung, course_kinks, control_changes_per_minute, wall_seconds, steep_seconds, edge_seconds,
           wall_pin_max_seconds, wall_extra_charge, stuck_seconds, died, reward_follow_kept, reward_settled,
           reward_regroup, reward_drift,
           reward_lost, reward_blocking, reward_death, reward_fidget, reward_stuck, reward_wall, reward_jitter,
           reward_effort, reward_repeat, approach_yards, follower_yards, reward_approach]

# forge status for this stage: the share kept with the leader (the plan's M4 measure, kept-with-leader >= 90%), how
# still the party stands with a still leader, how soon it regroups at a stop and how often, straying and blocking,
# deaths and rejoins, the leader's progress along its hops, and the rung. Targets are a readout, never a gate.
status:
  headline: [follow_kept_share, settled_share, regroup_share, regroup_seconds, drift_seconds, lost_seconds,
             blocking_seconds, deaths, rejoin_seconds, rejoined, leader_route_share, leader_report_age_ms,
             leader_out_of_sight_seconds, difficulty, wall_seconds, steep_seconds, edge_seconds, died, follower_yards,
             approach_yards]
  targets:
    # M2's targets are not M4's measures (null drops an inherited key; a target must be in the headline).
    found: null
    found_deepest: null
    find_seconds: null
    sight_seconds: null
    sight_to_arrival: null
    rooms_before_found: null
    revisit_rate: null
    timed_out: null
    found_heldout_map: null
    found_arena_ragefire: null
    time_to_escape_s: null
    pause_look_share: null
    straight_run_mean_s: null
    follow_kept_share: ">= 0.9"
    settled_share: ">= 0.8"
    regroup_share: ">= 0.9"
    regroup_seconds: "<= 5"
    drift_seconds: "<= 10"
    lost_seconds: "<= 5"
    blocking_seconds: "<= 3"
    rejoined: ">= 0.9"
    wall_seconds: "<= 2"
    died: "<= 0.02"
  # Death knights are never fielded here, by design: the party follows through a dungeon at its level band (13-25) and a
  # death knight starts at 55; the sim draws the seat again among the classes that fit (StageScenario's level redraw,
  # which the party follow takes as a dungeon does). forge status lists it under the headline, as group1_roles does.
  excluded:
    death_knight: "the party follows through a dungeon at its level band (13-25) and a death knight starts at 55"

convergence:
  # M1's patience, restated: M2 raises its own to 6 (2026-10-09).
  patience: 3
  # Converged on the stage's own measure, the share of the episode kept within the band of the leader; at the top of
  # its ladder (at_top_rung).
  measure: follow_kept_share

# The ladder (a running leader hopping forward with long stops -> turning back, speed bursts -> sudden stops -> sudden
# stops and steps back) is the fade's: the stage pays no shaping, so the fade moves the rung alone. It steps as soon as
# the kept share at the rung meets the rung's gate at an evaluation -- the gate alone, never waiting on a plateau
# (require_plateau: false) or on the cost ladder.
fade:
  rungs: [1.0, 0.5, 0.25, 0.0]
  gate_metric: follow_kept_share
  # Rising gates (move4-follow rework, B1): the ladder steps off rung 0 at 0.65 kept, off rung 1 at 0.70, off rung 2 at
  # 0.75 -- so it can start climbing, and still ends where the plan's bar is.
  gate_value: 0.75
  gate_values: [0.65, 0.70, 0.75]
  require_plateau: false

# No cost ladder: Stuck, Wall, Drift, Lost, Fidget, Blocking and Death are at their fixed price from the first step
# (Costs, off any ladder), and the noise prices (jitter, effort, repeats) at full price from the start, so nothing waits
# on a cost ladder (the dungeon plan's rule; M1's stall).
costs:
  enabled: false
  # M2's gate (found, 0.8) is inherited and means nothing here: this stage reports no `found` column (null drops it).
  gate_metric: null
  gate_value: null

layout_sampling:
  metric: follow_kept_share
  # No replay of lost evaluation episodes, as M1 and M2 (2026-10-09): the evaluation seeds are held out. M2's fresh-seed
  # sweep read 0.52 against 0.81 in the replayed evaluation, and this stage's gate and convergence read that evaluation.
  replay_fraction: 0.0
