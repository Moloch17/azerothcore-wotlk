# C3 -- survive (dungeon-curriculum C3; Stages.cpp combat3_survive, CombatEncounter): the same cleared Ragefire Chasm,
# packs that can kill -- three or four, linked, two levels up on the rung's -- pull after pull, the next waiting 30-45
# yd on until the seat goes for it. Food and drink are stocked and the gauntlet block eats, drinks and rests until
# ready, so resting between pulls and backing off are the seat's own choices. A death comes back alive at the entrance
# after 10 s (I4, EntranceRespawn) and walks back, and the pack it died to is still there to clear: never "give up";
# 360 s.
#
# Outcome (tier-scaled): Survived (2.0: no death in the episode) -- the stage's purpose -- and Clear per pack;
# InterruptLanded. Cost at full price: Away (0.02 a second dead, walking back from the entrance, or beyond 30 yd of a
# fighting pull; coming back is never paid, which would pay dying), Death (over w), Hurt, FireHurt, PullExtra, the
# clock. Shaping (faded): DamageDealt.
#
# Seeded from combat2_packs: every block carries; the gauntlet block (eat, drink, rest until ready) starts fresh.
extends: combat2_packs.yaml
run_name: combat3_survive

total_env_steps: 300000000

eval:
  report: [won, survived, packs_cleared, deaths, rejoins, rejoin_seconds, rejoined, dead_seconds,
           away_seconds, rest_seconds, extra_pulls, interrupts, fire_share, hurt_share, difficulty,
           at_top_rung, target_in_view, start_walk, died,
           reward_clear, reward_survived, reward_away, reward_interrupt_landed, reward_pull_extra, reward_fire_hurt,
           reward_hurt, reward_death, reward_step_cost, reward_damage_dealt, reward_repeat, reward_aimless,
           reward_effort, reward_jitter]

# forge status: did it live, and when it did not, did it come back -- the plan's development criterion is C3's recover
# (rejoined: rejoins over rises) at 0.9 or more -- and how long it was dead or away.
status:
  headline: [survived, won, packs_cleared, deaths, rejoined, rejoin_seconds, dead_seconds, away_seconds, rest_seconds,
             extra_pulls, hurt_share, difficulty]
  targets:
    interrupts: null
    interrupt_earnings: null
    fire_share: null
    target_in_view: null
    won: ">= 0.8"
    survived: ">= 0.8"
    packs_cleared: ">= 3"
    rejoined: ">= 0.9"
    rejoin_seconds: "<= 60"
    extra_pulls: "<= 0.1"

convergence:
  measure: survived

fade:
  enabled: true
  rungs: [1.0, 0.5, 0.25, 0.0]
  gate_metric: survived
  gate_value: 0.7
  require_plateau: false
  moving_classes: 1000

costs:
  enabled: false
  gate_metric: survived
  gate_value: 0.7

layout_sampling:
  metric: survived
