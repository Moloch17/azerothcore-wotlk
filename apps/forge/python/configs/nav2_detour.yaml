# N2 -- detour (vision movement curriculum PLAN §7, CONTRACT.md sec 4): the straight line is blocked in view -- doors,
# pillars, fences -- in the Stockades' rooms, the Deadmines and Shadowfang Keep (Wailing Caverns held out). The ladder
# opens the detour bins (route / straight 1.0-1.2 up to 2.5) and the length bins (20 to 120 yd); Lost (0.02/s while the
# body's route cost-to-go exceeds the start's by 40 yd) joins the costs; a timeout pays nothing beyond the clock.
# Episodes of 120 s. Seeds from nav1_sight (stage.json's seed chain): every block carries by name.
extends: nav1_sight.yaml
run_name: nav2_detour

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 150000000

mappo:
  # The camera splat (networks.CameraSplat): each camera patch's features laid on the costmap head's cells where its
  # pixels' rays land (depth and the camera's pose; lift, splat), so a door or pillar in view is a cell, not only a
  # direction of the broadcast embedding. On from here for the rest of the chain (nav1 runs without it). Seeded from
  # nav1: conv1 grows with the splat's channels at zero and the splat's projection starts fresh.
  camera_splat: true
  # The planned waypoint (MapEncoder.waypoints): steepest descent over the planner's cost-to-go from the body, 5 cells
  # of 2 yd on the fine tier and 2 of 8 yd on the coarse, and the cell reached -- bearing, distance, valid -- fed to the
  # policy beside the readouts (2026-10-15: the global planner -> local controller split; the policy walks to a point
  # well). On from here (nav1 stays without). Its join starts at zero: nav2's checkpoint resumes computing what it did.
  planner_waypoint: true
  # The coarse -> fine hierarchy (MapEncoder.plan, 2026-10-16): trips average ~85 yd, mostly past the fine crop's 48 yd
  # reach, where the fine goal plane was clamped to its border and 20 iterations carried value 40 yd. The coarse tier
  # plans first; its value, resampled, is the fine planner's start and held border, so the fine value is the route to
  # the real goal (its label). The fine tier then runs 32 iterations (the border is 24 cells from the body, more round
  # a detour), the coarse planner_k's 20. On from here (nav1 stays without); no parameter, so nav2's checkpoint resumes.
  planner_hierarchical: true
  planner_k_fine: 32
  # The waypoint walks over the classical planner (MapEncoder.classical_plan, 2026-10-16): a fixed-weight value
  # iteration over the costmap head's classes, measured live pointing the right way 66 % of the time on the coarse tier
  # against the learned value's 37 % (fine 46 % against 32 %). The readouts stay the learned planner's; the same walk
  # and numbers, so the waypoint's join reads what it read and nav2's checkpoint resumes (no new parameter).
  planner_waypoint_source: classical
  # The classical waypoint prices the map's own codes (networks.classical_factor, 2026-10-16): wall 100 and hazard 5
  # where the crop has seen one, floor and door the head's grade of passable ground (water, a hurting drop), the
  # head's guess only where the crop is unknown. Measured in nav2's aux pass, the classical plan over the true classes
  # points the right way 0.68 / 0.84 of the time (fine / coarse) against 0.53 / 0.79 over the head's, whose known-cell
  # IoU is 0.58 on walls: the rays' hits are the better map. Read live as classical_map_dir_acc_* beside
  # classical_dir_acc_*. The same walk and numbers; no parameter, so nav1's checkpoint seeds it by name as before.
  # Exported as .amdl version 17. On from here (nav3+ inherit).
  planner_waypoint_costs: map
  # Greedy training envs (exploration v3; 0.12 of this learner's envs act with the argmax of the movement heads, their
  # movement policy-gradient rows masked, their states and rewards training the critic): the argmax policy the
  # evaluation and the export play froze on 3.5 % of nav2's trips (2026-10-16: 27 of 118 failures over three
  # evaluations stood turning in place, a no-op the mode on 440-460 of 461 decisions) while the sampled policy walked
  # the same seeds. The traces say why: standing, the sampled policy presses a move 6-10 % of decisions and a stop
  # 83-89 % -- enough under sampling, since a press holds until released, and nothing under the argmax, since the
  # delay costs only the discount and StepCost (~0.02 a decision) and the mode never presses. With a share of the envs
  # frozen as the argmax freezes, the critic sees what standing costs over the whole trip and the gap V(moving) -
  # V(standing) that drives the press is learned, not inferred from the sampled policy's quick escapes.
  greedy_env_fraction: 0.12

# The potential paid on the bot's OWN map's route (potential.source "map", 2026-10-17; config.PotentialConfig,
# mappo.buffer.compute_potential_map): the step is paid 0.05 x the yards the move closed on the route the bot's mental
# map prices from the body to the goal (the sim labels every observation with that route's cost-to-go from the body
# and from the previous decision's position, both on the same current map, so the term is the move alone). The reward
# becomes the quantity the bot can perceive and that its classical waypoint displays, so following its own map's
# route pays at the step: in a blank map the unknown-priced route is near the straight line (explore toward the goal),
# in a known map it is the detour. nav1 stays on the bake's true route (as it trained); nav3+ inherit. The Outcome
# terms (Arrive x SPL, the clock) are as they were: the true route still judges the trip.
potential:
  source: map

status:
  targets:
    # SPL 0.85 at the 1.6-2.5 detour bin is the PLAN's reading; here the display target is the stage-wide SPL.
    spl: ">= 0.85"
    stop_error_yards: null
