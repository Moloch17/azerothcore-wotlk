# Stage 7, the end of the classes phase: one character playing its class in the world. A chain of 1-3 quests of its
# level band (15-20, 35-40, 58-60: the rung is the band) -- giver, typed objectives (kill, collect, buy, use,
# deliver, explore), turn-in -- in the world's own zone; a field of herbs and ore with what lives among them; a town's
# traders to sell, repair, restock and dress at. The journal (WorldBlock) holds what the seat has learned about the
# quest; the world block's actions start fresh here, everything else is seeded (the travel block from stage2_travel).
#
# 100M, with the quest weighted up: quest was the worst life stage of the second run.

extends: stage5_pack.yaml
run_name: stage15_life

total_env_steps: 100000000

eval:
  every_env_steps: 10000000
  episodes: 1024
  report: [quest_turned_in, quests_turned_in, quest_accepted, quest_progress, quest_complete, quest_held_out,
           quest_chain_length, quest_kills, nodes_gathered, skill_ups, town_won, sold_out, repaired, stocked,
           upgrades_equipped, corpses_looted, wasted_presses, goals_reached, serving_share, died, quest_band,
           open_world_deaths, releases, corpse_runs_completed, safe_rises, died_again, spirit_healer_uses,
           resurrections_accepted, seconds_dead]
