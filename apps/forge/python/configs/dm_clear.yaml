# DM_CLEAR -- the Deadmines by level (the user, 2026-10-26): the route is a person's recorded run (AnimusForge.Curriculum.
# PointNav.ClearWayFile, from `python -m animus.human dungeon-run`), so there is no navigation stage. A proper party of
# five -- a tank and a healer every episode, never a death knight below 55 -- learns the live dungeon at 60, where the
# sequence (the route, the pulls, the doors, the barrel and the cannon) is all there is to learn, and the ladder brings
# the level down a rung at a time (60, 50, 40, 32, 26, 22, 20, 18) as the legs and then the run are cleared. At every
# rung: legs first (one leg of the clear way an episode, drawn by failure rate), then mostly the whole run; the ladder
# steps on the whole runs' probes (Instance.WingRungRuns at WingRungTarget). The bar at 18 is dm6's: 70% of the
# evaluation's runs cleared with at most one wipe, for every leader role. Fresh networks, dm6's settings otherwise.
extends: dm6_clear.yaml
run_name: dm_clear

total_env_steps: 3000000000

eval:
  every_env_steps: 20000000
  episodes: 64
  sampled_every: 3
  sampled_episodes: 16
  trace_episodes: 8
  trace_all: false
  arms:
    with_partners: null
    no_map: 16
    no_memory: 16
    no_object_memory: 16
  report: [bar_clear, cleared, full_clear, wing_cleared_share, wing_wipes, ladder_level, wing_rung, at_top_rung,
           wing_is_leg, wing_is_full, wing_leg, wing_leg_arrived, wing_legs_learned, dk_guard, ready_pulls,
           wing_start_site, wing_killed_before, boss_rhahkzor, boss_sneed_shredder, boss_sneed, boss_gilnid,
           boss_smite, boss_greenskin, boss_cookie, boss_vancleef, wing_boss_kills, wing_trash_kills, wing_rises,
           wing_rejoins, wing_rejoin_seconds, wing_level, wing_probe, role_tank, role_healer, role_damage,
           deaths_tank, deaths_healer, deaths_damage, seat_deaths, is_leader, leader_role, pulls_started,
           out_of_turn_pulls, kept_with_leader_share, door_opened, leader_tank, leader_healer, leader_damage,
           bar_clear_leader_tank, bar_clear_leader_healer, bar_clear_leader_damage, cleared_share_leader_tank,
           cleared_share_leader_healer, cleared_share_leader_damage, kept_with_leader_tank, kept_with_leader_healer,
           kept_with_leader_damage, out_of_turn_leader_tank, out_of_turn_leader_healer, out_of_turn_leader_damage,
           level, died,
           reward_kill, reward_clear, reward_ready_pull, reward_idle, reward_death, reward_step_cost, reward_timeout,
           reward_out_of_turn_pull, reward_leader_away, reward_threat, reward_damage_dealt, reward_potential,
           reward_repeat, reward_effort, reward_jitter]

status:
  headline: [ladder_level, wing_rung, at_top_rung, wing_legs_learned, wing_leg_arrived, bar_clear, cleared,
             full_clear, wing_wipes, boss_vancleef, dk_guard, bar_clear_leader_tank, bar_clear_leader_healer,
             bar_clear_leader_damage, out_of_turn_pulls, kept_with_leader_share, deaths_tank, deaths_healer,
             deaths_damage]
  targets:
    dk_guard: "<= 0"
    wing_leg_arrived: ">= 0.85"
    bar_clear: ">= 0.7"
    bar_clear_leader_tank: ">= 0.7"
    bar_clear_leader_healer: ">= 0.7"
    bar_clear_leader_damage: ">= 0.7"
    cleared: ">= 0.7"
    full_clear: ">= 0.7"
    wing_wipes: "<= 1"
    boss_vancleef: ">= 0.7"

# The stage converges on the bar at the last rung (level 18): the convergence rule's top_rung waits for at_top_rung.
convergence:
  measure: bar_clear

fade:
  gate_metric: bar_clear
  gate_value: 0.5

costs:
  gate_metric: bar_clear
  gate_value: 0.5

layout_sampling:
  metric: bar_clear

# Fresh networks: no seed stage (init_from auto finds none: the stage extends nothing); no co-op partners.
cast:
  partners:
    stages: []
    eval_partners: []
    share: 0.0
