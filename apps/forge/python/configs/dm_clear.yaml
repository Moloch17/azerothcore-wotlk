# DM_CLEAR -- the Deadmines by level (the user, 2026-10-26): the route is a person's recorded run (AnimusForge.Curriculum.
# PointNav.ClearWayFile, from `python -m animus.human dungeon-run`), so there is no navigation stage. A proper party of
# five -- a tank and a healer every episode, never a death knight below 55 -- learns the live dungeon at 60, where the
# sequence (the route, the pulls, the doors, the barrel and the cannon) is all there is to learn, and the ladder brings
# the level down a rung at a time (60, 50, 40, 32, 26, 22, 20, 18) as the legs and then the run are cleared. At every
# rung: legs first (one leg of the clear way an episode, drawn by failure rate), then mostly the whole run; the ladder
# steps on the whole runs' probes (Instance.WingRungRuns at WingRungTarget). The bar at 18 is dm6's: 70% of the
# evaluation's runs cleared with at most one wipe, for every leader role.
#
# A standalone config (the user, 2026-10-26: "start it fresh"): nothing is inherited, every setting is written here.
# The training settings are the dungeon line's (dm1's base with dm6's gamma and episode cap); fresh networks.

run_name: dm_clear
socket: /tmp/animus-forge.sock
seed: 1
init_from: auto
seed_from: latest
total_env_steps: 3000000000
rollout_length: 128
overlap_updates: true
torch_threads: 4
log_every: 1
checkpoint_every: 25
keep_checkpoints: 5
train_device: auto
rollout_device: auto
mappo:
  hidden:
  - 256
  - 512
  - 512
  gamma: 0.999
  gae_lambda: 0.985
  reference_decision_ms: 100
  foresight_coef: 0.25
  foresight_horizons_seconds:
  - 5.0
  - 30.0
  foresight_time_scale_seconds: 60.0
  recurrent_size: 128
  chunk_length: 32
  goal_count: 10
  goal_slots: 4
  hindsight_coef: 0.1
  goal_targets: 23
  goal_every_decisions: 8
  slow_goal_size: 128
  slow_goal_gamma: 0.993
  slow_goal_lambda: 0.95
  slow_goal_lr: 0.0003
  goal_cell_hindsight_lookback: 8
  goal_cell_hindsight_coef: 0.15
  planner_k: 20
  planner_every: 8
  planner_waypoint: true
  planner_hierarchical: true
  planner_k_fine: 32
  planner_waypoint_source: sim
  planner_waypoint_costs: map
  foresight_obs_targets: true
  foresight_feedback: true
  goal_lookahead: true
  lookahead_coef: 0.5
  goal_entropy_scale: 1.0
  goal_entropy_final_fraction: 0.05
  goal_slot_entropy_weight: 0.1
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  look_entropy_coef: 0.004
  heading_entropy_coef: 0.003
  heading_entropy_final_fraction: 0.1
  value_coef: 1.0
  actor_lr: 0.00015
  critic_lr: 0.00015
  lr_final_fraction: 0.1
  entropy_final_fraction: 0.1
  epochs: 2
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
  value_norm_beta: 0.99
  per_layout_advantages: true
  min_layout_rows: 32
  target_kl: 0.02
  vision_chunk_rows: auto
  shared_blocks:
  - move
  - goal
  shared_init_layouts:
  - rogue
  greedy_env_fraction: 0.12
potential:
  enabled: true
  yards_scale: 0.05
  clip: 50
  source: map
  map_fallback: true
  episode_cap: false
aux:
  costmap_coef: 0.5
  planner_coef: 0.5
  rows: 256
  every: 2
  unseen_weight: 0.25
  planner_dir_coef: 0.02
  planner_dir_temp: 1.0
entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05
school:
  record: false
# Movement graded against the recorded run (the user, 2026-10-26): the realism columns on every evaluation
# (reference: the player's motion histograms) and the style reward (dataset: their motion windows), both built with
# `python -m animus.human build --recording <id>` into the data folder beside the clear way. The reward is a kept
# term, paid in full (the cost ladder is off): up to `coef` a decision for motion the discriminator cannot tell from
# the player's.
style:
  enabled: true
  dataset: /azerothcore/env/dist/etc/modules/animus/human/deadmines_motion_windows.npz
  reference: /azerothcore/env/dist/etc/modules/animus/human/deadmines_reference.json
eval:
  every_env_steps: 10000000
  # Sampled, as training plays: the argmax policy froze (0% of legs at 10-30M while the sampled evaluation did 81%).
  deterministic: false
  episodes: 64
  sampled_every: 3
  sampled_episodes: 16
  trace_episodes: 8
  trace_all: true
  arms:
    no_map: 16
    no_memory: 16
    no_object_memory: 16
  report:
