# The dungeon teacher's check (dungeon-curriculum I6) -- not a training stage. The teacher plays every seat of a party
# of five through Ragefire Chasm, door to Bazzalan, every pack and side boss on the way, on the player controller's
# keys and the sight block's presses (ArenaDefinition::Teacher). Run it with the local policy, never the learner:
#
#   forge run teacher_ragefire dungeon 96
#
# and read the "Wing run" lines (cleared, wipes, rises and rejoins) and, for a run that stands, the "Wing stuck" lines
# (each seat's teacher reason). The gate before any taper: every pull and side boss cleared, consistently.
#
# This config exists so the stage has one like every other (and a learner pointed at it by mistake does nothing that
# matters): no imitation, no self-imitation -- the teacher's runs are its own, not the policy's.
extends: combat3_survive.yaml
run_name: teacher_ragefire

seed_from: ""

total_env_steps: 100000000

mappo:
  hint_coef: 0.0
  sil_coef: 0.0

eval:
  every_env_steps: 1000000
  episodes: 8
  report: [wing_route_share, wing_trash_kills, wing_boss_kills, boss_killed, wing_wipes, wing_rises, wing_rejoins,
           wing_rejoin_seconds, wing_cleared_share, wing_rung, wing_scripted, wing_level, level]

status:
  headline: [wing_cleared_share, wing_boss_kills, boss_killed, wing_wipes, wing_rises, wing_rejoins,
             wing_rejoin_seconds]
  targets:
    # C3's targets are not the teacher's measures (null drops an inherited key).
    won: null
    survived: null
    packs_cleared: null
    rejoined: null
    rejoin_seconds: null
    extra_pulls: null
    hurt_share: null
    wing_cleared_share: ">= 0.95"
    boss_killed: ">= 0.9"

convergence:
  measure: wing_cleared_share

# C3's fade rungs and no cost ladder (the dungeon plan's rule), on the teacher's own measure.
fade:
  gate_metric: wing_cleared_share
  gate_value: 0.9

costs:
  gate_metric: wing_cleared_share
  gate_value: 0.9

layout_sampling:
  metric: wing_cleared_share
