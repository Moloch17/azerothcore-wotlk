# M3 -- verticality (movement-curriculum plan §2): up and down. Markers above the seat from a cliff foot, below it from
# a ledge top (the drop the shortcut, the way round the safe one), or on another floor of an inn; the height window
# climbs to 15-45 yd, so drops come to cost health and then to kill (MarkerVertical.* in the conf template). Movement
# only: no interactions, no closed doors. Seeds from move2_ground; what differs is below.
extends: move2_ground.yaml
run_name: move3_vertical

# A ceiling (plan §4: 300M, expected 3-4 h).
total_env_steps: 300000000

# FallDamage is a Cost at full price from the start (a fall's price is real, not noise); Stuck and Wall are back on the
# cost ladder, started again for the new ground.
costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

eval:
  report: [arrived, markers, markers_wanted, markers_broken, difficulty, at_top_rung, marker_rise, storey_legs,
           storey_up_legs, storey_down_legs, detour, time_ratio, overshoot, stop_distance, jumps, drops, falls, fall_damage, fall_deaths, deaths, stuck_seconds,
           wall_seconds, course_kinks, moves_refused, movement_casts, speed_casts, died, timed_out, reward_arrive,
           reward_progress, reward_fall_damage, reward_stuck, reward_wall, reward_jitter, reward_effort]
