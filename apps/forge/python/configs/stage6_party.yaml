# The parties phase: one real dungeon, the Deadmines from its door to VanCleef, run by five learned seats of its own
# level range under a learned director. Every run is a fresh instance; a wipe ends it (2026-09-30: only this one
# dungeon, only characters of its level).

extends: stage5_pack.yaml
run_name: stage6_party

total_env_steps: 200000000

eval:
  every_env_steps: 20000000
  episodes: 512
  report: [wing_route_share, wing_trash_kills, wing_boss_kills, boss_killed, wing_wipes, wing_assist,
           wing_crowd_seconds, wing_level, teammates_died, teammate_healing, idle_seconds_in_combat,
           director_member_orders, goals_reached, serving_share,
           aimless_presses, combat_dps, dps_scaled, level]

cast:
  agents:
    owner: "{runs_dir}/stage5_pack/best.pt"
