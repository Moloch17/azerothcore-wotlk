# N1 -- point in sight (vision movement curriculum, decision 0036; .agents/plans/vision-movement-curriculum: the PLAN's
# §7 and CONTRACT.md secs 4 and 5). PointNav in an empty Stockades and Ragefire Chasm (arenas `stockades`, `ragefire`;
# Wailing Caverns held out): each episode the seat spawns at a reachable cell of the bake, facing a random way, and a
# point goal is drawn in line of sight (PointNav.SightOnly) by the rung's detour and length bins. The goal is a minimap
# marker -- the compass block's bearing and distance, never withheld -- and the lesson is the controls: a straight line,
# stopping on the point (Arrive within 1 yd, stopped), the costmap's free / wall basics. No sim shaping at all: the time
# cost (StepCost a decision), Stuck and Wall from the first step, Death, and the learner's own potential term (below).
#
# The network: the camera, the two-tier mental map (the fine 48 x 48 crop at 2 yd and the coarse at 8 yd, map block
# revision 5), the costmap head and the planner (mappo.networks MapEncoder.plan: a VIN over the predicted
# traversability, trained by the labels the sim sends with every STEP, protocol 31), the cell pointer reading the
# planner's value, and the GRU. Every class and race at level 1, one layout per class around the shared trunk.
#
# The root of the nav chain (nav2_detour .. nav6_follow extend it): nothing to extend, nothing to seed from (the PLAN's
# decision 7: fresh weights, no seeding from M1-M4). init_from auto reads an empty seed chain.

run_name: nav1_sight
socket: /tmp/animus-forge.sock
seed: 1

init_from: auto
seed_from: latest

# A ceiling, not a target: convergence ends the stage (no pass gates).
total_env_steps: 150000000
rollout_length: 128

overlap_updates: true
torch_threads: 4
log_every: 1
checkpoint_every: 100
keep_checkpoints: 5

train_device: auto
rollout_device: auto

mappo:
  hidden: [256, 512, 512]
  # Per 100 ms of game time, compounded to the decision (250 ms). 0.997 for 60 s trips in sight; the later stages
  # lengthen it to 0.999 (nav4 on).
  gamma: 0.997
  gae_lambda: 0.985
  reference_decision_ms: 100
  foresight_coef: 0.25
  foresight_horizons_seconds: [5.0, 30.0]
  foresight_time_scale_seconds: 60.0
  recurrent_size: 128
  chunk_length: 32
  # The goal head and the cell pointer (free-choice-goals): the waypoint is a block of the fine crop, chosen every
  # 2 s (8 decisions; a maximum, a reached one chooses again at once), scored with the planner's pooled value.
  goal_count: 10
  goal_slots: 4
  hindsight_coef: 0.1
  goal_targets: 23
  goal_every_decisions: 8
  slow_goal_size: 128
  slow_goal_gamma: 0.993
  slow_goal_lambda: 0.95
  slow_goal_lr: 0.0003
  goal_cell_hindsight_lookback: 8
  goal_cell_hindsight_coef: 0.15
  # The planner: 20 value iterations, run every 8 decisions of a seat (the waypoint's clock) with its readouts and
  # the pointer's bonus cached in between (MappoTrainer._replan). At K=40 every decision it was 85% of the learner's
  # decision time (2026-10-13: 134.7 ms on dev).
  planner_k: 20
  planner_every: 8
  # The route is the goal's only observation since map block revision 7 (no compass in any nav stage): the policy
  # reads the sim's seventeen route scalars through the waypoint join (planner_waypoint_source sim). Without these
  # two keys nav1 had no goal input at all (2026-10-17: 0% arrived at 10M on the route-only restart).
  planner_waypoint: true
  planner_waypoint_source: sim
  foresight_obs_targets: true
  foresight_feedback: true
  goal_lookahead: true
  lookahead_coef: 0.5
  goal_entropy_scale: 1.0
  goal_entropy_final_fraction: 0.05
  goal_slot_entropy_weight: 0.1
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  # The look head at 0.4 of movement's (move2_seek's reading, 2026-10-11).
  look_entropy_coef: 0.004
  # The continuous heading (HeadingHead, heading.CONTRACT.md; on because stage.json's "continuous" names it, no switch
  # here): its own entropy bonus on the mixture's entropy surrogate (at most ln 2pi + ln 3 = 2.9 nats), apart from
  # entropy_coef's schedule, annealing to a tenth like entropy_final_fraction below, so the mode the evaluation and the
  # export play is the heading training drew.
  heading_entropy_coef: 0.003
  heading_entropy_final_fraction: 0.1
  value_coef: 1.0
  actor_lr: 0.00015
  critic_lr: 0.00015
  lr_final_fraction: 0.1
  # Argmax parity (the PLAN's §5): the entropy anneals to a tenth of itself by the budget's end, so the argmax policy
  # the evaluation and the export play is the one training sampled.
  entropy_final_fraction: 0.1
  epochs: 2
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
  value_norm_beta: 0.99
  per_layout_advantages: true
  min_layout_rows: 32
  target_kl: 0.02
  # The camera's update chunked where the card needs it (train.choose_vision_chunk_rows).
  vision_chunk_rows: auto
  # The movement shared across the classes (LayoutActor._attach_sharing): the move block's columns and its 25 controls,
  # the compass and the goal block -- the same in every class -- read and written by one set of actor weights, so what
  # one class learns about moving reaches all ten. The camera, entity and map columns are the encoders' already. A run
  # trained without sharing resumes with the shared weights taken from the rogue's (2026-10-14: the strongest single
  # walker, 92% arrived; averaging four classes' different motions -- rogues strafe, warriors back up -- gave every
  # class a blend that did none of them).
  shared_blocks: [move, compass, goal]
  shared_init_layouts: [rogue]

# The potential-based progress term (CONTRACT.md sec 5; the PLAN's §3), paid by the learner on the sim's C(body)
# labels with the learner's own gamma: every yard toward the goal by the best route pays, standing still pays 0,
# walking away pays negative; 0 on a done row and where no route is known. Paid at x1 for the whole curriculum: it
# never fades (the fade below is the difficulty ladder alone).
potential:
  enabled: true
  yards_scale: 0.05
  clip: 50

# The costmap head's cross-entropy and the planner's L1 (CONTRACT.md sec 5), each at half the policy loss's weight,
# never faded, on 256 rows of every second minibatch (the VIN's backward is memory- and time-bound: the pass was the
# update's limit once the rollout's planner was amortised).
aux:
  costmap_coef: 0.5
  planner_coef: 0.5
  rows: 256
  every: 2
  # Cells the crop has never seen grade at a quarter: 63 % of them are unseen, so the head learned to guess the prior.
  unseen_weight: 0.25
  # The planner's direction (2026-10-15): a cross-entropy over each cell's eight neighbours, the label's downhill one
  # the target, at a temperature of one cell (AuxConfig). The L1 leaves 26-50 yd of error where neighbouring fine cells
  # differ by 2 yd, so the readouts and the waypoint rarely point the right way. Sized on a synthetic map with 30 yd of
  # error: the cross-entropy is ~20 nats there (fine tier; ~5 coarse) and its gradient on the value map ~100 times
  # the L1's (~23 coarse), so 0.02 makes the term ~0.25 of loss beside the L1's 0.12-0.25 and its gradient ~4 times
  # the L1's on the fine tier (~1 on the coarse), falling as the directions come right (~1 nat when exact).
  planner_dir_coef: 0.02
  planner_dir_temp: 1.0

# Seeded evaluation every 10M steps: 256 trips at the training rung's bins over the two training dungeons (the pairs
# seeded by EpisodeSeed, no failure replay), argmax; the sampled policy on the first 128 of those seeds at every
# evaluation (the argmax gap); Wailing Caverns, never trained on, every evaluation; and the ablation arms every second
# evaluation, at the start one and at the stage's last.
#
# The cost (nav1, 2026-10-17, 82-yd trips at rung 2): the plain 256 took ~33 s, the sampled 256 ~32 s, Wailing's 64
# ~12 s and each arm's 64 ~11 s -- ~133 s an evaluation with the five arms it had. Sampled at 128 (~16 s) and the
# arms on every other evaluation, an evaluation is ~61 s without its arms and ~117 s with them: ~89 s on average, a
# third less (~44 s, or ~11 minutes over a 150M-step stage's 15 evaluations; ~6 s more saved for each arm added).
eval:
  every_env_steps: 10000000
  at_start: true
  episodes: 256
  seed: 1000
  deterministic: true
  sampled_every: 1
  # The sampled pass on the first 128 seeds (eval.sampled_episodes): its argmax_gap is those 128 against the plain
  # 256, a reading of the gap and not a like-for-like difference; the argmax judges, the sampled pass only reads.
  sampled_episodes: 128
  trace_episodes: 32
  trace_all: true
  heldout:
    wailing: 64
  heldout_every: 1
  heldout_on_best: true
  # The learner's own inputs taken away on the evaluation's seeds (evaluation.ABLATIONS): no_camera (the image
  # blanked), no_map (the map block and both crop tiers zeroed), no_planner (the planner's readouts and the pointer's
  # bonus zeroed), no_memory (the recurrent state reset every decision). Readings, never gates: what the policy steers
  # by, read as spl_no_camera and the like in forge status. Every second evaluation at the rung (arms_every counts the
  # rung's evaluations: a ladder's step starts it over), at the start evaluation (arms_at_start: what the seeded
  # networks steer by) and the stage's last (the budget's, or the one it converged on).
  arms_every: 2
  arms_at_start: true
  arms:
    no_camera: 64
    no_map: 64
    no_planner: 64
    no_memory: 64
    # The same seeds with every seat started blank (a MODE flag to the sim; evaluation.SHARED_MEMORY_ARM): the plain
    # evaluation's memory-on episodes against the same trips without the memory. Dropped when the sim ignores the flag.
    no_shared_memory: 64
    # The same seeds with the seats given no object memory (MODE_FLAG_NO_OBJECT_MEMORY; evaluation.OBJECT_MEMORY_ARM):
    # its memory_entities block zeros. Skipped with a line while the stage has no memory_entities block.
    no_object_memory: 64
  # The sim's episode columns (CONTRACT.md sec 3), and the learner's potential term summed over the episode.
  report: [arrived, spl, time_ratio, arrived_base_limit, time_limit_seconds, route_switches, optimal_yards,
           straight_yards, detour_factor, travelled_yards, stop_error_yards, falls, fall_damage_share, drowned, died,
           timed_out, stuck_seconds, wall_seconds, lost_seconds,
           revisit_seconds, jumps, swim_seconds, nav_rung, detour_bin, length_bin, replayed, waypoint_regret_yards,
           waypoints_chosen, at_top_rung, difficulty, course_kinks, control_changes_per_minute, movement_casts,
           reward_arrive, reward_step_cost, reward_stuck, reward_wall, reward_fall_hurt, reward_death, reward_drowned,
           reward_lost, reward_revisit, reward_potential, reward_jitter, reward_effort, reward_repeat,
           goals_cell_chosen, goals_cell_reached, goals_cell_lost, goals_cell_invalid, cell_goal_seconds,
           reward_cell_goal, reward_cell_lost]

# forge status for this stage: did it arrive, how efficiently (spl: arrived x optimal / max(optimal, travelled)), how
# fast against the bake's optimum, how precisely it stopped, how cleanly it got there, the rung; the perception and
# planning modules' own quality (costmap_iou, planner_mae_yards on the labelled cells, planner_mae_known on the cells
# the map knows -- from the last update; the classical waypoint's direction accuracy over the head's classes and over
# the map's own codes, classical_dir_acc_* and classical_map_dir_acc_*, mappo.planner_waypoint_costs) and the
# potential paid; the held-out dungeon's and the arms' spl. Targets are a readout, never a gate (no pass gates:
# convergence alone ends the stage).
status:
  # arrived_base_limit: arrived within the arena's own EpisodeSeconds (60 s here), the fixed clock every trip had
  # before the route-scaled one (PointNav.TimeFactor) -- the reading that compares with older runs. The memory pair
  # (evaluation.MEMORY_SPLIT_METRICS): the trips with the map's shared memory and those started blank; a released
  # bot always has it. Readings, never gates.
  headline: [arrived, spl, arrived_memory_on, spl_memory_on, arrived_memory_off, spl_memory_off, arrived_base_limit,
             time_ratio, route_switches, stop_error_yards, falls, fall_damage_share, died, drowned, timed_out,
             lost_seconds, wall_seconds, stuck_seconds, waypoint_regret_yards, waypoints_chosen, nav_rung, at_top_rung,
             costmap_iou, planner_mae_yards, planner_mae_known, planner_dir_acc_fine, planner_dir_acc_coarse,
             classical_dir_acc_fine, classical_dir_acc_coarse, classical_map_dir_acc_fine, classical_map_dir_acc_coarse,
             reward_potential, reward_potential_train,
             spl_heldout_wailing, arrived_heldout_wailing, spl_no_camera, spl_no_map, spl_no_planner, spl_no_memory]
  targets:
    arrived: ">= 0.98"
    spl: ">= 0.9"
    stop_error_yards: "<= 0.5"
    wall_seconds: "<= 0.5"
    timed_out: "<= 0.02"
    died: "<= 0.01"

convergence:
  # Converged on the stage's own measure, the argmax SPL at the top rung of the ladder (at_top_rung); the ladder
  # settled is a convergence signal too.
  measure: spl
  # The stage also ends on the ladder's last rung (stage.ConvergenceController.top_rung_end), the budget a ceiling:
  # its gate (fade.gate_metrics' last entries) met at 2 evaluations running, or SPL there with no new best beyond the
  # tracker's margin (~0.09 at 256 trips) for 6 evaluations and no trend that would clear it. The per-class rule
  # (score, KL, entropy, ladder, top rung all at once, for every class) met none of it in nav1's 150M steps (~12 h on
  # the cluster, 2026-10-18); six nav stages at their ceilings are a week before the dungeons. Inherited by nav2..nav6.
  # 6, not 4: nav1's own rung-2 SPL (0.43, 0.47, 0.52, 0.50, 0.53, 0.54, 0.53, 0.56, 0.61, 0.63 from 40M), replayed as
  # the last rung, read as a plateau at 100M under 4 -- a +0.015-an-evaluation climb under the margin, which went on
  # to 0.63 -- and not by 140M under 6.
  top_gate_evals: 2
  top_plateau_evals: 6
  # Entropy and learning rate hold until the ladder first reaches its last rung, then anneal over 20M steps; the
  # end conditions above wait for that, so an early-ending stage hands on an annealed policy.
  top_anneal_env_steps: 20000000
  patience: 3
  window: 4
  z: 2.0
  min_improvement: 0.02
  min_improvement_abs: 0.01
  kl: 0.003
  entropy_slope: 0.01
  hold_share: 0.02
  lr_hold_until_plateau: true

# The difficulty ladder (decision 0010), and nothing else: the stage pays no shaping, so the fade's scale is only the
# rung the sim reads (PointNav.RungBins0..3: which detour and length bins are open, and the start bearing's spread).
# It steps as soon as the evaluation at the rung meets every one of the rung's gates (fade.gate_metrics) -- arrived and
# SPL -- never waiting on a plateau (require_plateau false) and never back on the score; a collapse or stall only
# warns. A curriculum ladder, not a pass gate.
#
# Arriving with an SPL floor, not SPL alone (2026-10-18): SPL scores a failure 0 and any detour against the trip, so
# at 80-yd trips it is mostly the arrival rate times a route-efficiency discount, and a gate on it alone asks for both
# at once. nav1's curves (SPL gates 0.6 / 0.7 / 0.8): rung 0 (~24 yd) arrived 0.88 / SPL 0.84 at 10M; rung 1 (~44 yd)
# 0.75-0.76 / 0.67-0.71 over 20-30M; rung 2 (~82 yd) 0.48 -> 0.72 / 0.43 -> 0.63 from 40M to 130M, 28% of the trips
# timing out, and never met 0.8 -- the budget ended the stage on rung 2, rung 3 never played. The gates, one per rung
# (the fourth the last rung's own, which convergence.top_gate_evals ends the stage on): rung 0 0.85 / 0.75 (met at
# 10M); rung 1 0.75 / 0.65 (met at 20M, where SPL 0.7 took to 30M); rung 2 0.72 / 0.6, which nav1 reached at 120M --
# the last gate must be one a run gets to; the top rung (~100+ yd) the same 0.72 / 0.6, with the plateau rule ending
# the stage if it levels off below. SPL / arrived ran 0.87-0.95 at every rung, so the SPL floors (0.75-0.6) sit under
# what arriving at those rates gives: arriving decides, and the floor turns away a policy that arrives by wandering.
# gate_metric spl stays the collapse and stall alarms' metric.
fade:
  enabled: true
  rungs: [1.0, 0.5, 0.25, 0.0]
  window: 3
  regress_z: 2.0
  give_up: 2
  gate_metric: spl
  gate_metrics:
    arrived: [0.85, 0.75, 0.72, 0.72]
    spl: [0.75, 0.65, 0.6, 0.6]
  require_plateau: false
  # A difficulty ladder: it steps on its gate whatever the cost ladder is doing (nothing to fade).
  wait_for_costs: false
  # An evaluation is read only when its episodes were played at the ladder's rung (the sim's nav_rung, its
  # SightDraw::Rung of the shaping scale): nav2's resumed run once stepped to the top on rung 0's trips.
  rung_metric: nav_rung

# No cost ladder: StepCost, Stuck, Wall, Death and the noise prices are at full price from the first step (the dungeon
# plan's rule; M1's stall on a ladder that waited).
costs:
  # Noise prices (Repeat, Jitter, Aimless, Effort, Fidget, Stuck, Wall) start free and climb once arriving is learned:
  # at full price from step 0 they cost ~3 an episode against a potential worth ~1, and nav1 stood still (2026-10-13),
  # as stage1 did on 2026-10-04. The ladder ends at full price.
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

# The planner school's data (animus.school; docs/forge/reference/school.md): every 32nd decision of an env the
# learner keeps the bot's map crops and the labels (the true route) as a sample under shared/school/<run>/, for the
# offline planner to learn paths through unseen space from. Costs under 1% of the rollout; the policy path is untouched.
school:
  record: true
  record_every: 32
  record_max_samples: 600000

entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05

# Every class equally often (the user, 2026-10-13: "evenly train all classes and levels"): no reweighting toward the
# classes arriving least. The levels are even in the sim (StageDefinition::EvenLevels). The nav stages inherit this.
layout_sampling:
  enabled: false
  strength: 0.0
  max_ratio: 1.0
  metric: spl
  replay_fraction: 0.0

# The movement-style reward (animus.style): off.
style:
  enabled: false
