# >>> RESEED STATE (2026-10-09, owner: 'use this run to reseed stage 2 at the last rung') <<<
# This file is edited in place for a run that is a FRESH start of move2_seek seeded from the previous M2 run's
# checkpoint (runs/_finetune/move2_seek/best.pt on the host): the ladder is the single deep rung (fade.rungs [0.0];
# the four-rung ladder was [1.0, 0.5, 0.25, 0.0]), the learning rate is 1.5e-4, and the overall plateau waits 6
# evaluations (convergence.patience 6; M1's 3 is restated in M3 and M4). RESTORE THE FOUR-RUNG LADDER BEFORE ANY
# FROM-SCRATCH M2 (M1 -> M2): a start at fade rungs [0.0] from an M1 seed skips the easy rungs (the lesson of
# move1_controls, whose yaml was left at its end state). The same state as a hand-applied overlay:
# configs/overlays/move2_seek_reseed.yaml.
#
# M2 -- seek (perception-goals plan §4, "M2 in detail"; REDESIGN §2; the user, 2026-10-06: "M2 seek also happens
# inside the same Stockades instance. It has to find an object in a room, and that object and room is randomized.").
# The same empty Stockades as M1: the seat at a random hallway point (the entrance among them), facing a random way;
# one real object (a chest, crate, barrel, sack or strongbox) placed by the ladder -- in the hallway in sight of the
# spawn, just inside a front cell's opening, anywhere in a front cell, then deep (back rooms, hubs, end rooms) -- each
# rung keeping a tenth of the one below, its episodes 90, 120, 200 and 300 s. No compass: the camera's objective flag
# shows the object only in line of sight. Found is stopping within 3 yd of it. Its memory is the GRU's and the mental
# map's (the map block, REDESIGN §3).
#
# Seeds from move1_controls (stage.json's seed chain): the move block's columns carry over by name, the camera's
# encoder carries, the compass's weights stay behind and the mental map starts fresh (its join at zero). M1's
# hyperparameters otherwise; what differs is below.
extends: move1_controls.yaml
run_name: move2_seek

# The latest M1 checkpoint (the default, said here because M1 is still training as this is written).
seed_from: latest

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 250000000

mappo:
  # A 300 s episode whose one Outcome may come minutes in: 0.997 a 100 ms (M1's) discounts an arrival 60 s away to
  # 0.16 and 150 s to 0.01, below the step cost's sum over the same time. 0.998 (a horizon of about 50 s; 150 s away
  # keeps 0.05) is the step the plan's horizons allow before M4's 0.999, with the critic told where the object is
  # (SeekEncounter::WriteState) to carry the rest.
  gamma: 0.998
  # The full 128-decision BPTT window (REDESIGN §2: kept), not M1's 32-decision chunks.
  chunk_length: 128
  # Two epochs, not M1's four (REDESIGN §2, amendment 10). The profile with the map in (2,048 rows forward and back on
  # the host's card): the camera 74 ms, the camera and the map 151 ms, so at 128 decisions x 192 envs the encoders
  # alone take 7.3 s an update at four epochs (3.6 s at two), on a host already learner-bound at four x 3.8 s. Go back
  # to 4 if the first 10 minutes show the KL or the found rate lagging (approx_kl well under target_kl at two).
  epochs: 2
  # 0.4 of movement's from the deploy's resume (2026-10-07; M1's tenth to 47M): the doorway rung (the object seen only
  # by looking into a cell) held at 39% found for 30M steps with 46% of episodes ever sighting it and 85% of those
  # arriving -- a search failure, not a reach one. The camera turned on 1.7% of decisions (5.5% at 30M) and the look
  # entropy fell 1.08 -> 0.72. A prior toward looking around, never a mask.
  look_entropy_coef: 0.004
  # 1.5e-4 from the cleanup deploy (2026-10-07), the rate M2 was effectively running at: a convergence bug read every
  # harder rung as a plateau and annealed the rate from ~30M steps (fixed by ConvergenceController.rebaseline), so the
  # 3e-4 configured here was really about 3e-4 x 0.41. kl_move read 0.0136 at that reduced rate; at the full 3e-4 expect
  # ~0.03, over the 0.02 target. The (now correct) anneal lowers it further at the last rung. Revisit if the first
  # reads show kl_move well under 0.01 and found rising slowly.
  # 2.2e-4 from the deep rung (owner, 2026-10-09; analysis .agents/plans/m2-search): move KL read ~0.006, under the
  # 0.01 line this comment names, and found was still rising slowly. Free in throughput. Roll back if approx_kl_move
  # passes 0.03, explained_variance falls under 0.7 or found_deep drops by 0.08. M3 and M4 extend this file and keep
  # 1.5e-4 (restated there).
  actor_lr: 0.00015
  critic_lr: 0.00015
  # The camera's update in chunks (overseer, P2 review): the cluster's 8 GB and 16 GB cards need it, and the bench
  # ran out of memory at 192 envs unchunked (live M1 fit at 16 of 21.5 GB without it; the difference is unexplained).
  # "auto" (was 2048 for every card): the learner picks the chunk at start from the device's free memory, the whole
  # minibatch (0) where it fits, and 2048 where there is no GPU to ask. A number here is taken as it is.
  vision_chunk_rows: auto

# Amendment 9: 78 episodes every 10M, at the training rung (each of its rooms in turn, the object types cycled: at the
# deep rung every room twice), so `found` is the rung's own found rate, which the fade reads. The full sweep -- every
# (room, object) pair once, 195 episodes at the top rung, 300 s -- is the held-out "sweep" arena, played at the stage's
# last evaluation only (heldout_every past any stage's evaluations, and not on every new best).
eval:
  every_env_steps: 10000000
  # 156 (was 78) since the deep rung (2026-10-09): 78 episodes carry +-0.05, and a score swing of 0.5 between two
  # evaluations (60M to 70M) came from 8 frozen episodes. The sampled policy is played at every evaluation and the
  # held-out sweep too (fresh seeds, every room and object once at the top rung): the shipped bot's policy and a
  # held-out reading beside the training rung's.
  episodes: 156
  sampled_every: 1
  heldout:
    sweep: 195
  heldout_every: 1
  heldout_on_best: false
  # The ablation arms, each replaying the evaluation's seeds (the training rung's placements, the deterministic policy)
  # with one input taken away; 64 episodes each, after every evaluation (arms_every 1), read as found_no_flag and the
  # like in forge status and as policy rows in eval.csv. no_flag and no_camera exist from M1 (the objective flag
  # cleared; the image blanked, the map kept); no_map zeroes the map block's columns and the mental map's crop;
  # no_memory resets the recurrent state (GRU memory, slow memory, held goal and queue) before every decision, so the
  # policy acts from what it sees now. M1's no_compass has nothing to zero here (null drops the inherited key).
  # Readings, never gates. M3 and M4 extend this file and restate `arms: {}`.
  arms:
    no_compass: null
    no_flag: 64
    no_camera: 64
    no_map: 64
    no_memory: 64
  report: [found, found_hallway, found_doorway, found_room, found_deep, seek_rung, rung_carried, find_seconds,
           sighted, sight_seconds, sight_to_arrival, rooms_looked, rooms_entered, rooms_reentered, revisit_rate,
           rooms_before_found, objective_visible, room_depth, difficulty, deep_room, object_fallback,
           distance_travelled, course_kinks, control_changes_per_minute, wall_seconds, stuck_seconds, died,
           timed_out, reward_arrive, reward_step_cost, reward_sighting, reward_new_ground, reward_room_seen,
           reward_stuck, reward_wall, reward_jitter, reward_effort, reward_repeat]

# forge status for this stage: did it find the object, by rung (found_<rung>, each over the episodes placed at it) and
# in the deepest rooms, the rung it is on, how soon it saw it and got there after, and how it searched -- rooms looked
# into and walked into before finding it, and how often it went back into one. Found by room and by object are the
# evaluation's tables (categories seek_room, seek_object). Targets are a readout, never a gate; found_deepest's 0.9 is
# the plan's development criterion for P1.
status:
  headline: [found, found_hallway, found_doorway, found_room, found_deep, seek_rung, found_deepest, find_seconds,
             sight_seconds, sight_to_arrival, rooms_looked, rooms_before_found, revisit_rate, objective_visible,
             wall_seconds, timed_out, died,
             found_no_flag, found_no_camera, found_no_map, found_no_memory]
  targets:
    # M1's targets are not M2's measures (null drops an inherited key).
    arrived: null
    arrive_seconds: null
    time_ratio: null
    arrive_seconds_sight: null
    time_ratio_sight: null
    stop_distance: null
    overshoot: null
    stops_near: null
    course_kinks: null
    found: ">= 0.95"
    found_deepest: ">= 0.9"
    find_seconds: "<= 90"
    sight_seconds: "<= 60"
    sight_to_arrival: "<= 15"
    rooms_before_found: "<= 12"
    revisit_rate: "<= 0.2"
    wall_seconds: "<= 2"
    timed_out: "<= 0.05"
    died: "<= 0.01"

convergence:
  # Six evaluations without a new best (60M steps) before the score counts as plateaued (M1's 3, which the
  # reseeded run, starting near 0.77 found with a margin of ~0.1, would reach at once and start the anneal early).
  patience: 6
  # Converged on the stage's own measure, the share of objects found; at the top of its ladder (at_top_rung: the
  # ladder at the deep rung, which is the fade's end).
  measure: found

# The ladder and the aids (Sighting, NewGround, RoomSeen) step together on the fade's signal (amendment 7): the rung
# moves on once its own found rate (the evaluation plays the training rung) has plateaued at 80% or more, with the
# fade's window and regress rules -- a curriculum ladder, not a pass gate: the stage still ends on convergence.
fade:
  # Its own rungs (hallway, doorway, front room, deep), restated: they are M2's placements, not M1's shaping fade,
  # and this stage's gate and plateau rule are its own below.
  rungs: [0.0]
  gate_metric: found
  gate_value: 0.8
  # Steps on the gate alone (the dungeon plan's rule; M1 waited ~20M steps on a plateau with the gate long met).
  require_plateau: false

# Stuck and Wall are charged from the first step at their own small fixed price (Seek.Stuck, Seek.Wall: off this
# ladder). The other noise prices (jitter, effort, repeats) keep M1's cost ladder, gated on the found rate.
costs:
  gate_metric: found
  gate_value: 0.8

layout_sampling:
  metric: found
  # No replay of lost evaluation episodes since the deep rung (2026-10-09), as M1: the evaluation seeds are held out
  # (the fresh-seed sweep read 0.52 against 0.81 in the replayed evaluation at 80M). M3 and M4 restate 0.2.
  replay_fraction: 0.0
