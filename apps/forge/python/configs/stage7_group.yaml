# Stage 7: the group (2026-10-02, the Deadmines curriculum). The proper party under a learned director, on a corridor
# of pulls laid out as a dungeon's are -- trash, then elites, then three elites two levels up -- with food and drink to
# rest on between them, on its own ladder (three pulls and three wipes to spare up to eight and one); and camps.
# Ends on convergence; the budget is a ceiling.

extends: stage6_roles.yaml
run_name: stage7_group

total_env_steps: 400000000

eval:
  every_env_steps: 10000000
  # 384: an evaluation gives (class, build) pair i rung (i / pairs) mod 6, so 64 episodes over ~30 pairs reached
  # rungs 0-2 only and every party cleared everything (2026-10-02).
  episodes: 384
  report: [run_rung, pulls_cleared, clean_kill, wipes, teammates_died, engage_health, engage_mana, tank_hold_share,
           tank_form_share, tank_target_share, pulled_off_seconds, low_health_seconds, healing_per_mana,
           camp_peak_packs, camp_clean_packs, director_member_orders, rest_seconds, dps_scaled, level]

mappo:
  # The goal head keeps exploring through the party stages: faded to 5% over a stage, its choices locked in early
  # and the healers never found Protect again once it was made reachable (stage6, 2026-10-02: 2-7% of their goals).
  goal_entropy_final_fraction: 0.5
