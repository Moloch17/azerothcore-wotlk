# Stage 6: the roles (2026-10-02, the Deadmines curriculum). A proper party of five at 15-30, one role drilled a
# fight: the tank holding a pack (tank_hold), the healer keeping the party up through a fight longer than its mana
# bar (heal_keep), a damage dealer killing the tank's target without taking it (damage_discipline), and the tank
# pulling a camp one pack at a time (pull). The drilled seat's role terms weigh Raid.DrillWeight; each drill climbs
# its own rungs on the probes' wins. Ends on convergence; the budget is a ceiling.

extends: stage5_pack.yaml
run_name: stage6_roles

total_env_steps: 400000000

eval:
  every_env_steps: 10000000
  # 384: an evaluation gives (class, build) pair i rung (i / pairs) mod 6, so 64 episodes over ~30 pairs reached
  # rungs 0-2 only and every party cleared everything (2026-10-02).
  episodes: 384
  report: [clean_kill, died, wipes, kills, difficulty, tank_hold_share, tank_form_share, group_kept_share,
           healing_coverage, time_to_kill, threat_on_teammates, teammate_damage_taken, low_health_seconds,
           overheal_share, healing_per_mana, teammates_died, tank_target_share, pulled_off_seconds, interrupts,
           control_seconds, camp_packs, camp_peak_packs, camp_clean_packs, dps_scaled, level]

# Draws weighted by role as well as by score (inherited from stage4: strength 1, max_ratio 4, clean_kill): each build
# against the others of its role on what the role is for, so a healer that keeps nobody up is drawn more though its
# party's score was fine (2026-10-04: stage6's holy paladins cast two heals a fight and were never drawn more).
# Inherited by stage7 and stage8.
layout_sampling:
  role_metrics:
    healer: [-teammates_died, group_kept_share, healing_coverage]
    tank: [tank_hold_share, -teammate_damage_taken]
    damage: [-time_to_kill, tank_target_share]
