# Stage 6: pull after pull (1-4 creatures, sometimes an elite or a higher-level pack) with breaks between, for seven
# and a half minutes or until the bot dies -- recovering between fights and lasting through many of them: a pull left
# alone comes to the bot, engaging one ready pays, seven food and seven drink for eight or more pulls. A third of the
# episodes are the endurance run: the same eight pulls every time, ending on an elite pack two levels up, won by
# clearing the last one alive -- a plan rather than a fight.
#
# 100M: the gauntlet and the endurance run were both still rising at the end of their budgets in the second run.
# 1024 evaluation episodes: an endurance episode is 900 s, so 2048 would cost more sim time than the manual allows.

extends: stage5_pack.yaml
run_name: stage6_gauntlet

total_env_steps: 100000000

eval:
  every_env_steps: 10000000
  episodes: 1024
  trace_episodes: 4
  report: [clean_kill, won, died, pulls_cleared, dps, engage_health, engage_mana, supplies_used, control_seconds,
           hazard_seconds]
