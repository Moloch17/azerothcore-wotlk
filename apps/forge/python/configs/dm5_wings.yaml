# DM5 -- wings (dungeon-clear plan): the live Deadmines backwards along the clear way (WingReverse): the wing ladder's
# first rung starts the party before VanCleef, each rung a ninth of the way earlier, the last the entrance; what lies
# behind the start is dead (its bosses' doors open as their deaths open them), the Iron Clad Door open once the start
# is past it. The bar's levels, 17-20, with no lift; the rung's spare wipes. The leader's way is the next site with a
# living creature, the others keep with the leader, the tank pulls. The evaluation runs the last rung: the whole
# dungeon from the entrance. Seeded from dm4_roles; the pack block starts fresh.
extends: dm4_roles.yaml
run_name: dm5_wings

total_env_steps: 1000000000

eval:
  every_env_steps: 20000000
  episodes: 64
  report: [bar_clear, cleared, full_clear, wing_cleared_share, wing_wipes, ready_pulls, wing_start_site,
           wing_killed_before, boss_rhahkzor, boss_sneed_shredder, boss_sneed, boss_gilnid, boss_smite,
           boss_greenskin, boss_cookie, boss_vancleef, wing_boss_kills, wing_trash_kills, wing_rises, wing_rejoins,
           wing_rejoin_seconds, wing_rung, at_top_rung, wing_level, wing_probe, role_tank, role_healer, role_damage,
           deaths_tank, deaths_healer, deaths_damage, seat_deaths, is_leader, leader_role, pulls_started,
           out_of_turn_pulls, kept_with_leader_share, door_opened, level, died,
           reward_kill, reward_clear, reward_ready_pull, reward_idle, reward_death, reward_step_cost, reward_timeout,
           reward_out_of_turn_pull, reward_leader_away, reward_threat, reward_damage_dealt, reward_potential,
           reward_repeat, reward_effort, reward_jitter]
  # A run is up to two hours of the dungeon: fewer arms, fewer episodes each.
  arms:
    with_partners: 16
    no_map: 16
    no_memory: 16
    no_object_memory: 16
    no_planner: null
    no_shared_memory: null
    no_global: null

status:
  headline: [wing_cleared_share, cleared, full_clear, wing_wipes, wing_rung, wing_start_site, boss_vancleef,
             out_of_turn_pulls, kept_with_leader_share, deaths_tank, deaths_healer, deaths_damage]
  targets:
    won: null
    won_hold: null
    won_keep: null
    won_focus: null
    won_pull: null
    hold_share: null
    kept_share: null
    clean_share: null
    extra_pulls: null
    wipes: null
    wing_cleared_share: ">= 0.7"
    cleared: ">= 0.5"
    out_of_turn_pulls: "<= 0.05"
    kept_with_leader_share: ">= 0.9"

convergence:
  measure: wing_cleared_share

fade:
  gate_metric: wing_cleared_share
  gate_value: 0.5

costs:
  gate_metric: wing_cleared_share
  gate_value: 0.5

layout_sampling:
  metric: wing_cleared_share

cast:
  partners:
    stages: [dm4_roles]
    score: wing_cleared_share
    eval_partners: [dm4_roles]
