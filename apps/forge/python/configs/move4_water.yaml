# M4 -- water (movement-curriculum plan §2): getting in, swimming, the surface and the swim jump, diving to the bed,
# breath, getting out onto banks, and choosing between swimming and going round. A crossing at the Barrens oases,
# lakebeds in Stonebull Lake to forty yards deep as the ladder climbs, and chains of lakebeds longer than a breath
# (MarkerWater.* in the conf template). Seeds from move3_vertical; what differs is below.
extends: move3_vertical.yaml
run_name: move4_water

# A ceiling (plan §4: 250M, expected 2-3 h).
total_env_steps: 250000000

# Drowning is a Cost at full price from the start; Stuck and Wall are back on the cost ladder for the new ground.
costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

eval:
  report: [arrived, markers, markers_wanted, markers_broken, difficulty, at_top_rung, marker_rise, crossings,
           fallback_legs, banks_climbed, swim_seconds, breaths, drowned, underwater_self_damage, time_ratio, overshoot,
           stop_distance, jumps, stuck_seconds, wall_seconds, course_kinks, moves_refused, movement_casts, speed_casts,
           died, timed_out, reward_arrive, reward_progress, reward_drowning, reward_stuck, reward_wall, reward_jitter,
           reward_effort]

# Converged on the top rung and on the stage's own measure: the share of markers stopped on, across water and
# on lakebeds.
convergence:
  measure: arrived
