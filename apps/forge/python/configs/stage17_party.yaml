# Stage 10: up to four learned agents per env -- a tank, a healer and damage dealers of
# random classes -- with the scripted owner as the fifth player, against elite-heavy packs. Every agent assists,
# guards and heals its teammates; tanks hold the pull, healers keep the party up, damage dealers stay off the threat
# table. Like the gauntlet, give it episodes of several minutes. Env steps count every agent's decisions.

extends: stage16_companion.yaml
run_name: stage17_party

# 150M (2026-09-28, by the user's decision): at 50M the first party run of the second full run did not move -- the owner
# died in 67% of episodes at 0M, 18M and 35M alike.
total_env_steps: 150000000

eval:
  # Every 20M with 512 episodes (2026-09-28, by the user's decision): 2,048 five-seat party episodes at 96 envs took
  # the host ~15 minutes an evaluation while the cluster reached the next 10M in ~6, so the host evaluated back to
  # back and ran 7 updates of its own in the whole of stage17_party.
  every_env_steps: 20000000
  episodes: 512
  report: [dps, died, deaths, kills, pulls_cleared, wipes, owner_deaths, owner_healing, teammates_died,
    teammate_healing, threat_on_teammates, casts_completed, casts_cancelled, cancelled_stopped, cancelled_moved,
    cancelled_target, cancelled_other]

# The owner is played by a frozen checkpoint (animus.cast): the endurance policy, which clears pulls on its own,
# in 70% of the training episodes; the script's wandering owner in the rest (Owner.CastScriptedShare) and in every
# evaluation, so the reported owner_deaths keep their meaning.
cast:
  agents:
    owner: "{runs_dir}/stage11_endurance/best.pt"
