# G2 -- corridor (dungeon-curriculum G2; Stages.cpp group2_corridor, InstanceEncounter with
# ArenaDefinition::CorridorPacks):
# a party of five in a real Ragefire Chasm or Deadmines -- a fresh instance a run, every pack and patrol where the world
# database stands it -- four of the route's packs in route order a run, from a pack drawn each run (the packs before it
# cleared, the party set down short of it). The loop is pull, fight, rest, ready, next; the party's leader is its tank,
# or the "human" stand-in when it leads (a fifth of the runs have it in a seat: ArenaDefinition::StandInShare). Levels:
# Ragefire at the dungeon finder's band, the Deadmines at 17-20, each lifted by the ladder's rung.
#
# The dungeon teacher (I6) hints every seat and plays the rung's share of them (ArenaDefinition::Taught), tapered on
# the whole dungeon's ladder (StageScenario::WING_RUNGS: the levels above the band, the wipes spared, the script's share
# and the hint weight come down a rung each time the probes -- the policy alone, a fifth of the runs -- clear 0.6 of
# their corridor; Instance.WingRung*). Hint imitation is off from the rung the probes beat the teacher's own reference
# runs on (Instance.WingHintOffRung, animus.hint_cutoff), and the teacher never plays in an evaluation.
#
# Outcome (x the rung's tier scale, 1 + 0.25 x rung/3): each of the corridor's packs cleared in route order (Clear,
# Instance.CorridorPack), each pull started with every member ready (ReadyPull: the rest discipline), the kills (Kill).
# Cost at full price from the first step: a pack drawn into another pack's fight (PullExtra: the chain pull), standing
# about (Idle), straying from the leader (Lost), deaths and wipes (Death; the second wipe ends a run), the clock
# (StepCost, Timeout). Shaping (faded): the route walked (Approach), the crowd (Threat), damage dealt.
#
# Seeded from group1_roles (the seed chain: C3 -> G1 -> G2): every block carries but the pack and hint blocks, which
# start fresh (the hint block is never read by the networks). G1's hyperparameters otherwise; what differs is below.
extends: group1_roles.yaml
run_name: group2_corridor

# A ceiling, not a target: convergence ends the stage.
total_env_steps: 500000000

mappo:
  # A corridor of four pulls takes 10-15 minutes: the longer horizon.
  gamma: 0.999
  # Imitate the teacher's press where the sim hints one (a taught arena's training runs, below the cutoff rung; the
  # hint_cutoff holds it at 0 from the cutoff on). Never self-imitation: it keeps no camera images.
  hint_coef: 1.0
  sil_coef: 0.0
  # The goal head keeps exploring through the party stages (the archived stage6's lesson: its choices locked in early).
  goal_entropy_final_fraction: 0.5

# A corridor draws its own start (no Go-Explore cells).
explore:
  enabled: false

# Fixed seeds: seed i plays its party (seat 0's class and build pair i mod pairs) in the corridor its seed names
# (WingRun::CorridorFirst), in Ragefire or the Deadmines by the arenas' final weights, at the evaluation's conditions
# (the ladder's last rung: the band's own levels, no help). 128 runs; the eval videos (I0) film a sample of them, one
# seat a party spread over the places and classes, their rung read off wing_rung and their outcome off cleared.
eval:
  every_env_steps: 10000000
  episodes: 128
  seed: 1000
  deterministic: true
  report: [cleared, corridor_share, corridor_in_order, corridor_cleared, corridor_packs, corridor_first, chain_pulls,
           ready_pulls, wing_wipes, wing_rises, wing_rejoins, wing_rejoin_seconds, wing_trash_kills, wing_boss_kills,
           wing_rung, wing_level, wing_probe, wing_scripted, with_stand_in, without_stand_in, clear_standin,
           clear_allbot, role_tank, role_healer, role_damage, deaths_tank, deaths_healer, deaths_damage, seat_deaths,
           died, reward_clear, reward_ready_pull, reward_kill, reward_pull_extra, reward_idle, reward_lost,
           reward_death, reward_step_cost, reward_timeout, reward_approach, reward_threat, reward_damage_dealt,
           reward_repeat, reward_aimless, reward_effort, reward_jitter]
  # H: the party with the "human" stand-in in a seat, on the same seeds, beside the all-bot party.
  arms:
    with_human: 64
    with_partners: 64
  arms_every: 2

# forge status: the corridors cleared and in what order, the chain pulls, the rest discipline, wipes and rejoins, the
# stand-in split (clear_allbot from the plain evaluation, clear_standin from the with_human arm, standin_gap their
# difference: H's measure, within ~10 points), and the ladder's rung. Targets are a readout, never a gate.
status:
  headline: [cleared, corridor_share, corridor_in_order, chain_pulls, ready_pulls, wing_wipes, wing_rejoin_seconds,
             clear_allbot, clear_standin, standin_gap, deaths_tank, deaths_healer, wing_rung]
  targets:
    # G1's measures are not G2's (null drops an inherited key).
    won: null
    won_hold: null
    won_keep: null
    won_focus: null
    won_pull: null
    hold_share: null
    kept_share: null
    focus_share: null
    clean_share: null
    extra_pulls: null
    wipes: null
    rejoined: null
    rejoin_seconds: null
    cleared: ">= 0.7"
    corridor_in_order: ">= 3"
    chain_pulls: "<= 0.25"
    wing_wipes: "<= 0.3"
    wing_rejoin_seconds: "<= 60"
    standin_gap: "<= 0.1"
  # Death knights are never fielded in a dungeon's level band (a death knight starts at 55: the sim draws the seats
  # again among the classes that can be the band's level).
  excluded:
    death_knight: "a run is at its dungeon's level band (Ragefire's, the Deadmines' 17-20), below a death knight's 55"

convergence:
  measure: cleared

# The ladder by gate: the shaping fade steps on the evaluation's cleared rate at 0.6, one evaluation at a rung, never
# waiting on a plateau or the classes' own rungs. The support ladder (WING_RUNGS) steps on the probes alone, in the sim.
fade:
  enabled: true
  rungs: [1.0, 0.5, 0.25, 0.0]
  gate_metric: cleared
  gate_value: 0.6
  require_plateau: false
  moving_classes: 1000

# Off: every price at full price from the first step.
costs:
  enabled: false
  gate_metric: cleared
  gate_value: 0.6

layout_sampling:
  metric: cleared

# Co-op partners (I7): G1's policy and this run's own snapshots in up to two of the seats of a third of the parties;
# the with_partners arm plays G1's.
cast:
  partners:
    stages: [group1_roles]
    score: cleared
    eval_partners: [group1_roles]
