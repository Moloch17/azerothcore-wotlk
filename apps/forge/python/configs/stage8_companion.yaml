# Stage 8, the first of the parties phase: the gauntlet beside an owner, a player of a random class and role near the
# bot's level. The bot follows (Component H's trail of the owner's path, at the owner's pace), assists and guards it;
# tanks keep enemies on themselves, healers keep the owner alive, damage dealers stay off the threat table. The seat's
# own death costs 10 and every owner death 15 (Owner.Death), so guarding the owner comes before the seat's health.
#
# The owner is played by a frozen checkpoint (animus.cast): the solo gauntlet policy, which clears pulls on its own,
# in 70% of training episodes; the script's wandering owner in the rest (Owner.CastScriptedShare) and in every
# evaluation, so owner_deaths keeps its meaning. Copy that checkpoint to every cluster worker before the stage.

extends: stage6_gauntlet.yaml
run_name: stage8_companion

total_env_steps: 50000000

eval:
  every_env_steps: 10000000
  episodes: 1024
  report: [clean_kill, won, died, pulls_cleared, owner_deaths, owner_healing, follow_restarts, follow_distance_mean,
           serving_share, aimless_presses,
           aimless_consume_not_needed, aimless_trap_no_enemy, aimless_mode_flip, aimless_needless_move, aimless_pet_off_goal]

cast:
  agents:
    owner: "{runs_dir}/stage6_gauntlet/best.pt"
