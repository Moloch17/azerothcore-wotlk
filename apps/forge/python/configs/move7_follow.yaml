# M7 -- company (movement-curriculum plan §2): moving with someone. Keep within 3-10 yd of a leader that walks trips
# across the ground (Follow.* in the conf template): fall behind, catch up, do not crowd it, go where it went. The
# leader is moved by the player controller as a client would move it -- the seek helper's keys on the early rungs, a
# frozen M6 checkpoint on half the training episodes from Follow.CastFromRung -- never a spline. Seeds from
# move6_mounted (the same blocks, so the M6 checkpoint plays the leader's row as it was trained).
extends: move6_mounted.yaml
run_name: move7_follow

# A ceiling (plan §4: 300M, expected 3-4 h).
total_env_steps: 300000000

# The leader's row: an M6 policy, frozen, in the episodes the sim casts it (stage.json cast "leader"). Evaluations
# keep the scripted leader, so the score is measured against the same mover throughout.
cast:
  agents:
    leader: "{runs_dir}/move6_mounted/best.pt"

# Arriving is not the point here: the time kept within the band of the leader is (FollowKept, the Outcome).
convergence:
  measure: follow_in_band_share

fade:
  gate_metric: follow_in_band_share
  gate_value: 0.8

costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: follow_in_band_share
  gate_value: 0.8

layout_sampling:
  metric: follow_in_band_share

eval:
  report: [follow_in_band_share, follow_distance_mean, follow_distance_sd, catch_ups, lost_seconds, aggro_pulled,
           leader_cast, leader_trips, difficulty, at_top_rung, stuck_seconds, wall_seconds, swim_seconds, jumps,
           fall_damage, course_kinks, moves_refused, movement_casts, speed_casts, died, timed_out,
           reward_follow_kept, reward_lost, reward_aggro, reward_progress, reward_stuck, reward_wall, reward_jitter,
           reward_effort]
