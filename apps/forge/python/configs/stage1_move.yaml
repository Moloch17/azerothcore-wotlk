# Stage 1, the root of the movement phase: covering ground on the seat's own legs, with nothing to fight, on every
# kind of ground at once (Stages.cpp: open, broken, water, rooms, ledges, depths, chain).
#
# First on purpose: a seat steers itself -- eight egocentric bearings under a held yaw and pitch, with the ground read
# along sixteen rays -- and everything after inherits legs that already work. Mounting is masked, so what is left is
# what a player does before it can ride: Sprint, Dash, Travel Form, Aspect of the Cheetah, and not stopping.
#
# The four movement drills of the first runs (move, indoor, jump, dive) were separate stages that each extended move
# and none another, so the chain ended in one of them and the rest were a dead end. As arenas of one stage, every
# update sees every terrain. 100M: move, indoor, jump and dive were still rising at their 50M budgets.

extends: stage4_duel.yaml
run_name: stage1_move

total_env_steps: 250000000

mappo:
  # The trips are the whole lesson; a floor on exploration keeps a seat from settling on "hold forward" over ground
  # that punishes it.
  entropy_final_fraction: 0.3
  # No entity in a movement layout is a set; stage2_travel inherits this, and the sets start at stage3.
  seat_sets: false

# Arrival is already the outcome here, and the movement terms are what the trip is; stage2_travel inherits this.
fade:
  enabled: false

# The noise prices (Repeat, Jitter, Aimless, Effort, Fidget) climb x0.25 -> x0.5 -> x1 as arriving plateaus at each:
# the first run at full price (2026-10-04) paid about -9 an episode in noise for a 6% chance at arriving and stood
# still from 5M steps on. The score is at full price throughout, and nothing converges before the ladder is.
costs:
  enabled: true

eval:
  trace_episodes: 64
  every_env_steps: 5000000
  # Every third evaluation also plays sampled actions on the same seeds: the movement stages' jitter, restarts and
  # fidget are what a sampled policy shows and an argmax one can hide (movement-smooth C). stage2_travel inherits it.
  sampled_every: 3
  report: [arrived, spl, lost, wedged, stall_seconds, stalls, travel_seconds, start_distance, walk_distance,
           distance_travelled, dry_detour, detour_band, saved, died, timed_out, crossing, swim_seconds, ledge,
           ledge_drop, jumps, drops, fall_damage, fall_deaths, dive, dive_depth, breaths, drowned, checkpoints,
           chain_broken, breathing_casts, reward_clearance]

layout_sampling:
  metric: arrived
