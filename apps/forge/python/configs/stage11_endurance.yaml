# A planned run: the same eight pulls in the same order, every episode, ending on an elite pack two levels above the
# bot. Stage 3 taught the fights; what is left here is the plan -- what to spend on the opener, what to keep for the
# last pull, and whether the fourth pull (a small one) is used as a rest or as a chance to get ahead. It is won by
# clearing the last pull alive: the 900 s clock running out is a loss however far it got.
#
# Trained by name (`forge start stage11_endurance`), after stage10_gauntlet, which it seeds from.

extends: stage10_gauntlet.yaml
run_name: stage11_endurance

total_env_steps: 60000000

# The run is the same every episode, so an evaluation's spread comes from the characters alone and settles sooner
# than the gauntlet's.
eval:
  every_env_steps: 10000000
  # 900 s episodes: the duel's inherited 2048 would be 14,400 sim-seconds an evaluation at 128 envs, twice the
  # party line; 1024 is 7,200 (manual 4, "What an evaluation costs"), still ~57 seeded episodes per class/build.
  episodes: 1024
  trace_episodes: 4

# Won by finishing the run. The floors are provisional, to be reset from the first run: clearing the last pull is
# hard, and the interesting number early on is how far a run gets (pulls_cleared, 8 is the whole thing).