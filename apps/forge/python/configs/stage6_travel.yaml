# Stage 7: getting somewhere. A character of level 20 or more (riding and a mount of its level)
# starts in Old Hillsbrad with a place 60-320 yd away by path. Mounting takes a cast, so a short trip is faster on foot
# and a long one on a mount; the policy learns which, and to arrive on the ground ready to fight. Paid by potential
# shaping on the distance left, arriving (faster pays more), damage taken and death. Episodes end on arriving.

extends: stage1_move.yaml
run_name: stage6_travel

# Trips take seconds to a minute: shorter than a fight, one policy for every class/build.
total_env_steps: 20000000

eval:
  every_env_steps: 2000000
  baseline: fight
  report: [arrived, spl, lost, wedged, stall_seconds, stalls, travel_seconds, start_distance, walk_distance,
           distance_travelled, dry_detour, detour_band, mounted_fraction, saved, died,
           route_complete, route_failed, route_shortcut]

