# The PvP stage: self-play one-on-one. Two learned agents of random classes and builds fight in each env, both
# played by this policy, so both sides of every fight are training data, across class matchups. The far side is
# the live policy, never a script and never a frozen checkpoint.
#
# Evaluation plays the learner against itself too. Its score then says little about progress (both sides improve
# together), so the score-plateau half of convergence is weak here: the stage ends mostly on its policy settling
# (approx_kl and entropy), and the per-class won/died columns are the ones to read.
#
# A fight turns on what happened tens of seconds before (a stealthy approach, a trinket baited out), so the horizon
# is long: gamma 0.999 and lambda 0.995 per 100 ms.

extends: stage8_duel.yaml
run_name: stage12_pvp
rollout_length: 256
mappo:
  gamma: 0.999
  gae_lambda: 0.995

# ~4 h at ~14k env steps/s (two seats).
total_env_steps: 50000000

eval:
  report: [won, dps, died, time_to_kill, damage_taken, cast_seconds_wasted]

# The far side of the mirror arena is the live policy: the learner plays itself, in training and in evaluation.
cast:
  opponents: ""
