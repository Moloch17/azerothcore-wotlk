# Stage 9: the Deadmines from its door to VanCleef, run by five learned seats of its own level range under a learned
# director -- the goal's own dungeon, after Ragefire Chasm. Every run is a fresh instance; the wipes to spare come
# with the ladder's rung.

extends: stage8_ragefire.yaml
run_name: stage9_deadmines

# No end: the run trains until it is stopped by hand (2026-10-01, the user watches the stats). The budget is a ceiling
# no run reaches, and convergence neither ends the stage nor takes a class out of the draw.
total_env_steps: 1000000000000

convergence:
  advance: false
  hold_share: 1.0

eval:
  # Every 40M: an evaluation of 64 runs of up to four hours kept the host's learner evaluating most of the time.
  every_env_steps: 20000000
  episodes: 64
  report: [wing_route_share, wing_trash_kills, wing_boss_kills, boss_killed, wing_wipes, wing_rung, wing_probe,
           wing_cleared_share, wing_scripted, wing_crowd_seconds, wing_level, teammates_died, teammate_healing,
           idle_seconds_in_combat, director_member_orders, goals_reached, serving_share,
           aimless_presses, combat_dps, dps_scaled, level]

cast:
  agents:
    owner: "{runs_dir}/stage5_pack/best.pt"

mappo:
  # The goal head keeps exploring through the party stages: faded to 5% over a stage, its choices locked in early
  # and the healers never found Protect again once it was made reachable (stage6, 2026-10-02: 2-7% of their goals).
  goal_entropy_final_fraction: 0.5
  # Imitate the scripted fight's press where the sim suggests one (the dungeon's support, Instance.WingHint): the
  # weight the sim writes falls with the support and is 0 by 60% of the budget and in every evaluation.
  hint_coef: 1.0
