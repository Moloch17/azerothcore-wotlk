# The mage's rotation drill: the root of its fighting line (the classes phase). Three ranged builds that all do the same
# thing, which is what makes a mage cheap to learn.
#
# One file per class, each saying the same thing: where the class's line seeds from. The movement phase (stages 1-2) is
# trained once for every class in the shared run, so this stage seeds from that run's travel checkpoint rather than from
# a mage-only stage2_travel, which does not exist. `init_from: auto` cannot find it (the seed chain looks under this
# run's own runs directory); `{shared_runs}` is the shared root's runs directory beside this class's own
# (animus.config). Seeding across is allowed because the layout check is one-directional: a mage-only run takes the mage
# out of an all-class checkpoint and leaves the other nine behind (animus.bootstrap).
#
# Everything else -- the budget, the evaluation, the convergence rule -- is the shared stage3_rotation's.

extends: ../stage3_rotation.yaml
run_name: stage3_rotation

init_from:
  - "{shared_runs}/stage2_travel/best.pt"
