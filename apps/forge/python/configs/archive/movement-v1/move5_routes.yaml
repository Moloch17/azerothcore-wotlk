# M5 -- long routes (movement-curriculum plan §2): one trip an episode, 150-600 yd across mixed ground, where the way is
# not visible from the start; the detour climbs from 1.3 to 3.0 times the straight line (MarkerRoutes.* in the conf
# template). Runs on today's ground probe and the marker's bearing, and is expected to plateau lower until the local
# map and route tiers land (.agents/plans/local-map-perception/). Seeds from move4_water; what differs is below.
extends: move4_water.yaml
run_name: move5_routes

# A ceiling (plan §4: 500M, expected 4-6 h).
total_env_steps: 500000000

# Seven-minute episodes, one trip each: fewer evaluation episodes keep an evaluation's sim time where the shorter
# stages' are (1024 x 420 s against 2048 x 150 s).
eval:
  episodes: 1024
  report: [arrived, difficulty, at_top_rung, route_length, detour, time_ratio, revisits, stop_distance, overshoot,
           stuck_seconds, wall_seconds, swim_seconds, jumps, drops, fall_damage, course_kinks, moves_refused,
           movement_casts, speed_casts, died, timed_out, reward_arrive, reward_progress, reward_stuck, reward_wall,
           reward_fall_damage, reward_jitter, reward_effort]

costs:
  enabled: true
  rungs: [0.0, 0.25, 0.5, 1.0]
  gate_metric: arrived
  gate_value: 0.8

# Converged on the top rung and on the stage's own measure: whether the one long trip arrived.
convergence:
  measure: arrived
