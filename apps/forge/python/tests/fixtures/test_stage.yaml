# The tiny test stage: a stage config for the tests that run the learner against a fake sim (test_train_run,
# test_parallel, test_gates). Not a curriculum stage and never trained: it is the hyperparameters of the archived
# curriculum's base config (configs/archive/stage4_duel.yaml, git tag curriculum-v1) without the commentary, frozen
# here so the tests do not depend on the archive or on whatever the movement stages' base becomes. The tests
# shrink it further with --set overrides (tiny networks, a few env steps).

run_name: test_stage
socket: /tmp/animus-forge.sock
seed: 1

init_from: auto

total_env_steps: 250000000
rollout_length: 128

overlap_updates: true
torch_threads: 4
log_every: 1
checkpoint_every: 100
keep_checkpoints: 5

train_device: auto
rollout_device: auto

mappo:
  hidden: [256, 512, 512]
  gamma: 0.997
  gae_lambda: 0.985
  reference_decision_ms: 100
  foresight_coef: 0.25
  foresight_horizons_seconds: [5.0, 30.0]
  foresight_time_scale_seconds: 60.0
  recurrent_size: 128
  seat_sets: true
  chunk_length: 32
  goal_count: 12
  goal_slots: 4
  hindsight_coef: 0.1
  goal_targets: 29
  goal_every_decisions: 64
  slow_goal_size: 128
  slow_goal_gamma: 0.993
  slow_goal_lambda: 0.95
  slow_goal_lr: 0.0003
  foresight_obs_targets: true
  foresight_feedback: true
  goal_lookahead: true
  lookahead_coef: 0.5
  slow_layout: director
  slow_gamma: 0.996
  slow_gae_lambda: 0.98
  goal_entropy_scale: 1.0
  goal_entropy_final_fraction: 0.05
  goal_slot_entropy_weight: 0.1
  clip: 0.2
  value_clip: 0.2
  entropy_coef: 0.01
  value_coef: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  lr_final_fraction: 0.1
  entropy_final_fraction: 1.0
  epochs: 4
  minibatches: 4
  max_grad_norm: 0.5
  use_value_norm: true
  value_norm_beta: 0.99
  per_layout_advantages: true
  min_layout_rows: 32
  target_kl: 0.02

eval:
  every_env_steps: 5000000
  at_start: true
  episodes: 2048
  seed: 1000
  deterministic: true
  sampled_every: 0

convergence:
  patience: 3
  window: 4
  z: 2.0
  min_improvement: 0.02
  min_improvement_abs: 0.01
  kl: 0.003
  entropy_slope: 0.01
  hold_share: 0.02
  lr_hold_until_plateau: true

fade:
  enabled: true
  rungs: [1.0, 0.5, 0.25, 0.0]
  window: 3
  regress_z: 2.0
  give_up: 2

entropy_floor:
  fraction: 0.3
  max_boost: 4.0
  rate: 0.05

layout_sampling:
  enabled: true
  strength: 1.0
  max_ratio: 4.0
  metric: clean_kill
  replay_fraction: 0.2
