# docker-compose.yml for Animus Forge, the training sim built on AzerothCore.
#
# Start training and attach to the worldserver console:
#
#   ./forge.sh
#
# which is `docker compose up -d` followed by `docker compose attach ac-worldserver`. Plain
# `docker compose up` works too, but it only streams logs: Compose never forwards your keyboard to a
# container, so the console needs the attach. Detach again with Ctrl+P Ctrl+Q; Ctrl+C stops the server.
#
# Open the source in VS Code (Dev Containers: "Reopen in Container") or start the dev container by hand
# while training keeps running:
#
#   docker compose --profile dev up -d ac-dev-server
#
# Everything here is namespaced as ac-animus-forge (project, containers, volumes, network, images) and
# published on its own host ports, so it runs side by side with a stock AzerothCore checkout.
#
# Machine-specific settings (GPU passthrough, reusing existing volumes) belong in a
# `docker-compose.override.yml` next to this file, which is merged automatically and gitignored.

name: ac-animus-forge

x-build-args: &build-args
  USER_ID: ${DOCKER_USER_ID:-1000}
  GROUP_ID: ${DOCKER_GROUP_ID:-1000}
  DOCKER_USER: ${DOCKER_USER:-acore}

x-database-info: &database-info
  AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
  AC_WORLD_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_world"
  AC_CHARACTER_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_characters"

# The image ac-worldserver and ac-dev-server share: the toolchain and Python, with the source tree
# bind-mounted at /azerothcore.
x-dev-image: &dev-image
  image: ac-animus-forge-dev-server:${DOCKER_IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: ./apps/docker/Dockerfile.dev-server
    args: *build-args
    target: dev
  # The GPU (AMD/ROCm, gfx1100 here), for the learner to train on and for hipcc to compile against: it
  # picks its target from the cards it can see, so the compiler needs them as much as the runtime does.
  # /dev/kfd and /dev/dri/renderD* are world-accessible on this machine, so no group_add is needed; on a
  # host where they are not, add the ids from `getent group render video`. An NVIDIA card wants the
  # deploy/reservations block instead (commented on ac-worldserver below).
  devices:
    - /dev/kfd
    - /dev/dri
  security_opt:
    - seccomp=unconfined

services:
  ac-database:
    container_name: ac-animus-forge-database
    image: mysql:8.4
    networks:
      - ac-animus-forge-network
    ports:
      # Only reachable from this machine: the default root password is not meant for the network. Set
      # DOCKER_DB_ROOT_PASSWORD, and drop the 127.0.0.1 in an override, to reach it from elsewhere.
      - "127.0.0.1:${DOCKER_DB_EXTERNAL_PORT:-13306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DOCKER_DB_ROOT_PASSWORD:-password}
    volumes:
      - ${DOCKER_VOL_DB:-ac-animus-forge-database}:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 5s
      timeout: 10s
      retries: 40

  # ac-db-import and ac-authserver are the stock AzerothCore images, compiled from this tree inside
  # `docker build`. Training needs neither: ac-worldserver creates and updates the databases itself
  # (Updates.AutoSetup) and the sim takes no client connections. They are kept in the "stock" profile
  # so a plain `docker compose up` compiles the core only once:
  #   docker compose --profile stock up -d
  ac-db-import:
    container_name: ac-animus-forge-db-import
    profiles: [stock]
    image: ac-animus-forge-db-import:${DOCKER_IMAGE_TAG:-latest}
    networks:
      - ac-animus-forge-network
    build:
      context: .
      target: db-import
      dockerfile: apps/docker/Dockerfile
      args: *build-args
    environment:
      <<: *database-info
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
    volumes:
      - ${DOCKER_VOL_ETC:-./env/dist/etc}:/azerothcore/env/dist/etc
      # [osxfs optimization]: https://stackoverflow.com/a/63437557/1964544
      - ${DOCKER_VOL_LOGS:-./env/dist/logs}:/azerothcore/env/dist/logs:delegated
    depends_on:
      ac-database:
        condition: service_healthy

  # The training server: the forge sim and its auto-started Python learner.
  #
  # It runs the worldserver built from the bind-mounted source tree (env/dist/bin), not a baked image,
  # because the learner needs the module's python/ directory, a venv and the GPU. The first start builds
  # the worldserver and creates the venv (see apps/docker/forge-worldserver.sh), which takes a while.
  # After changing C++, rebuild in the dev container and restart this service:
  #
  #   docker compose exec ac-dev-server ./acore.sh compiler build
  #   docker compose restart ac-worldserver
  ac-worldserver:
    <<: *dev-image
    container_name: ac-animus-forge-worldserver
    command: ["bash", "/azerothcore/apps/docker/forge-worldserver.sh"]
    networks:
      - ac-animus-forge-network
    # The console: keep stdin open so `docker compose attach ac-worldserver` can type commands into it.
    # Without stdin the console reads end-of-file and shuts the server down.
    stdin_open: true
    tty: true
    # A real init as PID 1 forwards `docker stop` to the worldserver (which then stops the learner so it
    # saves a checkpoint) and reaps background children such as TensorBoard.
    init: true
    # Every start retrains the queue from scratch, so the server is never restarted behind your back.
    restart: "no"
    stop_grace_period: 1m
    env_file:
        ${DOCKER_AC_ENV_FILE:-conf/dist/env.ac}
    environment:
      <<: *database-info
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      # torch wheel index for the first-start venv. This machine's card is AMD, so the default is the
      # ROCm index and a rebuilt venv keeps the GPU; without it pip takes PyPI, which is CUDA on Linux
      # and would leave the learner on the CPU. Override for another card: PyPI is "", CPU only is
      # https://download.pytorch.org/whl/cpu
      ANIMUS_TORCH_INDEX_URL: ${ANIMUS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/rocm6.4}
      # Where training writes runs/ and layouts/ (AnimusForge.OutputDir): data, kept out of the source tree.
      AC_ANIMUS_FORGE_OUTPUT_DIR: ${ANIMUS_FORGE_OUTPUT_DIR:-/azerothcore/var/animus-forge}
    ports:
      # TensorBoard for the learner's runs, on http://localhost:16006, and the forge dashboard (config and
      # live progress) on http://localhost:18800. The forge sim itself opens no network listener (no world
      # socket, SOAP or remote access), and both of these are bound to the loopback address.
      - "127.0.0.1:${DOCKER_TENSORBOARD_EXTERNAL_PORT:-16006}:6006"
      - "127.0.0.1:${DOCKER_DASHBOARD_EXTERNAL_PORT:-18800}:8800"
    volumes:
      - ${DOCKER_VOL_ROOT:-.}:/azerothcore:cached
      - ac-animus-forge-build-dev:/azerothcore/var/build
      - ac-animus-forge-ccache-dev:/azerothcore/var/ccache
      # Maps, vmaps and mmaps (AC_DATA_DIR points here).
      - ${DOCKER_VOL_DATA:-ac-animus-forge-client-data}:/azerothcore/env/dist/data:ro
    # PyTorch uses shared memory between processes.
    shm_size: 8gb
    # The AMD GPU is passed in by the shared dev-image anchor above, which both this service and
    # ac-dev-server use. For an NVIDIA card instead (needs the NVIDIA Container Toolkit), drop the
    # anchor's devices block and put this here or in docker-compose.override.yml:
    #
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu]
    depends_on:
      ac-database:
        condition: service_healthy
      ac-client-data-init:
        condition: service_completed_successfully

  ac-authserver:
    container_name: ac-animus-forge-authserver
    profiles: [stock]
    image: ac-animus-forge-authserver:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      target: authserver
      dockerfile: apps/docker/Dockerfile
      args: *build-args
    networks:
      - ac-animus-forge-network
    tty: true
    restart: unless-stopped
    env_file:
        ${DOCKER_AC_ENV_FILE:-conf/dist/env.ac}
    environment:
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      AC_TEMP_DIR: "/azerothcore/env/dist/temp"
      AC_LOGIN_DATABASE_INFO: "ac-database;3306;root;${DOCKER_DB_ROOT_PASSWORD:-password};acore_auth"
    volumes:
      - ${DOCKER_VOL_ETC:-./env/dist/etc}:/azerothcore/env/dist/etc
      # [osxfs optimization]: https://stackoverflow.com/a/63437557/1964544
      - ${DOCKER_VOL_LOGS:-./env/dist/logs}:/azerothcore/env/dist/logs:delegated
    ports:
      - ${DOCKER_AUTH_EXTERNAL_PORT:-13724}:3724
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-client-data-init:
    container_name: ac-animus-forge-client-data-init
    image: ac-animus-forge-client-data:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      target: client-data
      dockerfile: apps/docker/Dockerfile
      args: *build-args
    volumes:
      - ${DOCKER_VOL_DATA:-ac-animus-forge-client-data}:/azerothcore/env/dist/data

  # used for extracting maps from files shipped with game client
  # Most of the time this shouldn't be needed
  ac-tools:
    container_name: ac-animus-forge-tools
    image: ac-animus-forge-tools:${DOCKER_IMAGE_TAG:-latest}
    build:
      context: .
      target: tools
      dockerfile: apps/docker/Dockerfile
      args: *build-args
    working_dir: /azerothcore/env/client/
    volumes:
      # this is not the directory of the extracted data! It's the client folder used by the extractors
      - ${DOCKER_AC_CLIENT_FOLDER:-./var/client}:/azerothcore/env/dist/bin/Data
    # Activate with `docker compose --profile tools ...`
    profiles: [tools]

  # Dev container with the source tree bind-mounted from the host, for VS Code (.devcontainer) or a shell.
  # Please use Linux, WSL2 or any ext-compatible filesystem to avoid performance issues.
  #
  # It runs alongside ac-worldserver: it publishes no ports and shares the build volumes, so a build here
  # is what ac-worldserver runs after a restart. Don't start a second training worldserver in it: both
  # would train into the same runs/ directories.
  ac-dev-server:
    <<: *dev-image
    container_name: ac-animus-forge-dev-server
    tty: true
    # Every start makes sure the forge learner's venv has torch and pytest (apps/docker/animus-venv.sh), so the
    # learner's tests run here:
    #   docker compose exec -w /azerothcore/apps/forge/python ac-dev-server .venv/bin/python -m pytest
    command: ["bash", "-c", "bash /azerothcore/apps/docker/animus-venv.sh; exec bash"]
    env_file:
        ${DOCKER_AC_ENV_FILE:-conf/dist/env.ac}
    environment:
      <<: *database-info
      AC_DATA_DIR: "/azerothcore/env/dist/data"
      AC_LOGS_DIR: "/azerothcore/env/dist/logs"
      # torch wheel index if the venv needs torch (see ac-worldserver).
      ANIMUS_TORCH_INDEX_URL: ${ANIMUS_TORCH_INDEX_URL:-}
    networks:
      - ac-animus-forge-network
    volumes:
      - ${DOCKER_VOL_ROOT:-.}:/azerothcore:cached
      # [osxfs optimization]: https://stackoverflow.com/a/63437557/1964544
      - ac-animus-forge-build-dev:/azerothcore/var/build
      - ac-animus-forge-ccache-dev:/azerothcore/var/ccache
      # this is not the directory of the extracted data! It's the client folder used by the extractors
      - ${DOCKER_AC_CLIENT_FOLDER:-./var/client}:/azerothcore/env/dist/bin/Data
      - ${DOCKER_VOL_DATA:-ac-animus-forge-client-data}:/azerothcore/env/dist/data:ro
    # Activate with `docker compose --profile dev ...`
    profiles: [dev]
    depends_on:
      ac-database:
        condition: service_healthy

volumes:
  ac-animus-forge-database:
    name: ac-animus-forge-database
  ac-animus-forge-client-data:
    name: ac-animus-forge-client-data
  ac-animus-forge-build-dev:
    name: ac-animus-forge-build-dev
  ac-animus-forge-ccache-dev:
    name: ac-animus-forge-ccache-dev

networks:
  ac-animus-forge-network:
    name: ac-animus-forge-network
